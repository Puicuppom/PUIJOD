<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUIJOD - Mario Block Edition</title>
    
    <!-- === ส่วนที่เพิ่มสำหรับปักหมุด (PWA) === -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E52521">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9382/9382189.png">
    <!-- =================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Press+Start+2P&display=swap');

        :root {
            /* << --- VIBRANT COLORS UPDATED --- >> */
            --primary-color: #43B047; /* Mario Green */
            --danger-color: #ef4444;  /* Vibrant Red */
            --success-color: #22c55e; /* Vibrant Green */
            
            --mario-red: #E52521;
            --mario-yellow: #FAC000;
            --mario-blue: #5C94FC;
            --mario-brown: #D97B00;
            --mario-dark-brown: #8C4516;
            --text-color-dark: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--mario-blue);
            background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
            color: var(--text-color-dark);
            padding: 2rem 0;
            image-rendering: pixelated;
        }
        
        .container { 
            max-width: 840px;
            margin: auto; 
            padding: 15px; 
        }
        .hidden { display: none !important; }

        /* --- MARIO HEADER --- */
        header { 
            text-align: center; 
            margin-bottom: 30px;
            background: rgba(0,0,0,0.4);
            padding: 25px 20px;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        header h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--mario-yellow);
            text-shadow: 3px 3px #000;
            font-size: 2rem;
            line-height: 1.2;
        }
        header p#user-email-display { 
            color: #fff; 
            font-size: 0.9rem; 
            word-break: break-all;
            font-family: 'Kanit', sans-serif;
        }
        #logout-btn { 
            font-family: 'Press Start 2P', cursive;
            background-color: var(--mario-red); 
            color: white;
            width: auto; 
            padding: 10px 20px; 
            display: inline-block; 
            font-size: 0.9rem;
            border: 2px solid #000;
            box-shadow: 4px 4px 0px 0px var(--text-color-dark);
            cursor: pointer;
            transition: all 0.1s ease-out;
            border-radius: 8px;
        }
        #logout-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        /* --- 8-BIT BLOCK SECTIONS --- */
        .section {
            background: var(--mario-brown);
            padding: 25px;
            border-radius: 0;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            border: 4px solid #000;
            color: #fff;
        }
        .section-title {
            text-align: center;
            margin-bottom: 25px;
            color: #fff;
            font-weight: 600;
            font-size: 1.5rem;
            text-shadow: 2px 2px #000;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            text-shadow: 1px 1px #000;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #000;
            border-radius: 0;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5);
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            border: 2px solid #000;
            border-radius: 0;
            background-color: var(--primary-color);
            color: white;
            font-family: 'Kanit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease-out;
        }
        button:active { 
            transform: translate(4px, 4px);
            box-shadow: none;
        }
        
        .positive { color: var(--success-color) !important; font-weight: bold; }
        .negative { color: var(--danger-color) !important; font-weight: bold; }

        .dashboard { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 25px;
        }
        
        .card {
            background: var(--mario-yellow);
            padding: 20px;
            border-radius: 0;
            border: 4px solid #000;
            text-align: center;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8);
        }
        .card h3 { 
            font-size: 0.9rem; 
            color: rgba(0,0,0,0.8); 
            font-weight: 500; 
            margin-bottom: 12px;
        }
        .card .amount { 
            font-size: 1.4rem; /* << --- FONT SIZE ADJUSTED --- >> */
            font-weight: 700;
            color: #000;
            word-break: break-all;
        }
        
        .view-toggle { 
            display: flex; 
            margin-bottom: 25px; 
            border: 2px solid #000;
        }
        .view-toggle-btn { 
            flex: 1; 
            padding: 10px; 
            background: var(--mario-dark-brown); 
            border: none;
            border-left: 2px solid #000;
            cursor: pointer; 
            font-family: 'Kanit'; 
            font-size: 1rem; 
            color: #fff; 
            font-weight: 500; 
        }
        .view-toggle-btn:first-child { border-left: none; }
        .view-toggle-btn.active { 
            background-color: var(--primary-color); 
            color: white;
            font-weight: 600;
        }

        .list-group-header {
            background-color: var(--mario-dark-brown);
            padding: 15px 20px;
            border: 2px solid #000;
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        /* Override positive/negative colors for the header for better contrast */
        .list-group-header .positive { color: #80FFAF !important; }
        .list-group-header .negative { color: #FF8A8A !important; }
        
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 2px dashed #000;
            color: #000;
        }
        .sub-list { 
            background: #fff; 
            border: 2px solid #000;
            border-top: none;
        }
        
        .modal-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { 
            background: var(--mario-brown);
            padding: 30px; 
            border: 4px solid #000;
            width: 100%; 
            max-width: 500px; 
            color: #fff;
        }
        
        @media (min-width: 600px) {
            .dashboard { grid-template-columns: repeat(4, 1fr); }
        }
        /* === MODIFIED FOR MOBILE VIEW === */
        @media (max-width: 480px) {
            .dashboard { grid-template-columns: repeat(2, 1fr); } /* ปรับเป็น 2 คอลัมน์สำหรับมือถือ */
        }

        /* === [NEW] ความสะดวก === */
        #app-container { padding-bottom: 90px; }

        /* ปุ่ม + ลอย (บล็อก ? สไตล์มาริโอ้) */
        .fab {
            position: fixed; right: 20px; bottom: 20px; z-index: 90;
            width: 64px; height: 64px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--mario-yellow); color: #000;
            font-family: 'Press Start 2P', cursive; font-size: 1.6rem; line-height: 1;
            border: 4px solid #000; box-shadow: 4px 4px 0 #000;
        }
        .fab:active { transform: translate(4px, 4px); box-shadow: none; }

        /* แถบเลือกเดือน */
        .month-nav { display: flex; gap: 10px; align-items: flex-end; }
        .month-nav .form-group { flex: 1; min-width: 0; margin-bottom: 0; }
        .month-nav .form-group select { padding: 12px 6px; }
        .month-nav .nav-btn {
            width: 48px; flex: 0 0 48px; height: 46px; padding: 0;
            background: var(--mario-dark-brown); font-size: 1.1rem;
        }
        .month-nav .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ช่องค้นหา */
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box input::-webkit-search-cancel-button { display: none; }
        .search-box input {
            width: 100%; padding: 12px 44px 12px 15px; border: 2px solid #000;
            font-family: 'Kanit', sans-serif; font-size: 1rem; box-shadow: inset 2px 2px 0 rgba(0,0,0,0.5);
        }
        .search-box .clear-btn {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 32px; height: 32px; padding: 0; box-shadow: none; border: none;
            background: transparent; color: #000; font-size: 1.2rem;
        }
        .search-summary {
            background: var(--mario-dark-brown); border: 2px solid #000; padding: 10px 15px;
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-weight: 600;
        }

        /* รายการแบบปัดซ้ายเพื่อโชว์เครื่องมือ */
        .transaction-item {
            display: block; position: relative; overflow: hidden; padding: 0;
            list-style: none; background: #fff;
        }
        .item-front {
            position: relative; z-index: 1; background: #fff;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            padding: 14px 12px; cursor: pointer;
            touch-action: pan-y; user-select: none; -webkit-user-select: none;
            transition: transform 0.2s ease-out;
        }
        .item-front.dragging { transition: none; }
        .item-front.open { box-shadow: 3px 0 0 #000; }
        .item-details { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .item-name { font-weight: 500; overflow-wrap: anywhere; }
        .item-date { font-size: 0.85rem; color: #555; }
        .item-amount { font-weight: 600; white-space: nowrap; }
        .item-actions-behind {
            position: absolute; top: 0; right: 0; bottom: 0; width: 216px; display: flex;
        }
        .item-actions-behind button {
            flex: 1; width: auto; height: 100%; padding: 0; border: none; border-radius: 0;
            border-left: 2px solid #000; box-shadow: none; color: #fff; font-size: 0.95rem;
        }
        .item-actions-behind button:active { transform: none; filter: brightness(0.85); }
        .item-actions-behind .dup-btn { background: #2563eb; }
        .item-actions-behind .edit-btn { background: #d97706; }
        .item-actions-behind .delete-btn { background: #dc2626; }
        .swipe-hint { text-align: center; font-size: 0.85rem; margin: -12px 0 14px; opacity: 0.85; text-shadow: 1px 1px #000; }

        /* ปุ่มเลือกวันที่ด่วน */
        .date-chips { display: flex; gap: 8px; margin-top: 8px; }
        .date-chips button {
            width: auto; padding: 6px 12px; font-size: 0.9rem; font-weight: 500;
            background: var(--mario-dark-brown); box-shadow: 2px 2px 0 #000;
        }
        .date-chips button:active { transform: translate(2px, 2px); box-shadow: none; }

        /* Toast แจ้งเตือน */
        #toast-host {
            position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
            z-index: 200; display: flex; flex-direction: column; gap: 8px;
            width: calc(100% - 32px); max-width: 420px; pointer-events: none;
        }
        .toast {
            pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: #fff; color: #000; border: 3px solid #000; box-shadow: 4px 4px 0 #000;
            padding: 10px 14px; font-weight: 500; animation: toast-in 0.15s ease-out;
        }
        .toast.success { background: #dcfce7; }
        .toast.error { background: #fee2e2; }
        .toast .toast-action {
            width: auto; padding: 6px 12px; font-size: 0.9rem; flex: 0 0 auto;
            background: var(--mario-red); box-shadow: 2px 2px 0 #000;
        }
        @keyframes toast-in { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- AUTH CONTAINER -->
        <div id="auth-container">
            <div id="login-view" class="section auth-form">
                <h2 class="section-title">เข้าสู่ระบบ</h2>
                <form id="login-form">
                    <div class="form-group"><label for="login-email">อีเมล</label><input type="email" id="login-email" required></div>
                    <div class="form-group"><label for="login-password">รหัสผ่าน</label><input type="password" id="login-password" required></div>
                    <button type="submit">เข้าสู่ระบบ</button>
                </form>
            </div>
        </div>

        <!-- MAIN APP CONTAINER -->
        <div id="app-container" class="hidden">
            <!-- MARIO HEADER -->
            <header>
                <h1>PUIJOD COINS</h1>
                <p id="user-email-display"></p>
                <button id="logout-btn">QUIT</button>
            </header>

            <!-- === DATE FILTER MOVED HERE === -->
            <div class="filter-section section month-nav">
                <button type="button" class="nav-btn" id="prev-month-btn" aria-label="เดือนก่อนหน้า">◀</button>
                <div class="form-group"><label for="year-filter">ปี</label><select id="year-filter"></select></div>
                <div class="form-group"><label for="month-filter">เดือน</label><select id="month-filter"></select></div>
                <button type="button" class="nav-btn" id="next-month-btn" aria-label="เดือนถัดไป">▶</button>
            </div>
            
            <!-- MARIO DASHBOARD -->
            <div class="dashboard">
                <div class="card"><h3>คงเหลือ (สะสม)</h3><p class="amount" id="balance">฿0.00</p></div>
                <div class="card"><h3>รายรับ (เดือนนี้)</h3><p class="amount" id="total-income">฿0.00</p></div>
                <div class="card"><h3>รายจ่าย (เดือนนี้)</h3><p class="amount" id="total-expense">฿0.00</p></div>
                <!-- === MODIFIED CARD === -->
                <div class="card"><h3>ผลต่าง (เดือนนี้)</h3><p class="amount" id="monthly-difference">฿0.00</p></div>
            </div>

            <div class="view-toggle">
                <button class="view-toggle-btn active" onclick="setView('transactions')">ดูรายการ</button>
                <button class="view-toggle-btn" onclick="setView('summary')">ดูสรุป</button>
            </div>

            <div id="transaction-view">
                <!-- Date filter was removed from here -->
                <div class="section">
                    <h2 class="section-title">ประวัติรายการ</h2>
                    <p class="swipe-hint">ปัดรายการไปทางซ้าย (หรือแตะ) เพื่อ ซ้ำ / แก้ไข / ลบ</p>
                    <div class="search-box">
                        <input type="search" id="search-input" placeholder="🔍 ค้นหาทุกเดือน เช่น กาแฟ, Grab" autocomplete="off" enterkeyhint="search">
                        <button type="button" class="clear-btn hidden" id="search-clear" aria-label="ล้างคำค้น">✕</button>
                    </div>
                    <div id="list"></div>
                </div>
            </div>

            <div id="summary-view" class="hidden">
                <div class="section">
                    <h2 class="section-title">สรุปรายปี <span id="summary-year-title"></span></h2>
                    <div style="overflow-x:auto; background: #fff; color: #000; padding: 10px; border: 2px solid #000;">
                        <table id="summary-table" style="width: 100%; border-collapse: collapse;"></table>
                    </div>
                </div>
            </div>

             <div class="section actions-section">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="export-year-filter">ปีที่ Export</label>
                    <select id="export-year-filter"></select>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                    <button class="action-btn" id="export-template-btn" style="background-color: #6c757d;">Export Template</button>
                    <button class="action-btn" id="export-data-btn" style="background-color: #6c757d;">Export Data</button>
                    <button class="action-btn" id="import-btn" style="background-color: #6c757d;">Import XLSX</button>
                </div>
                <input type="file" id="import-file" class="hidden" accept=".xlsx, .xls">
            </div>

            <!-- [NEW] ปุ่ม + ลอย -->
            <button type="button" class="fab" id="add-fab" aria-label="เพิ่มรายการ">+</button>
        </div>
    </div>

    <!-- [NEW] ADD TRANSACTION MODAL -->
    <div id="add-modal-container" class="modal-container hidden">
        <div class="modal-content">
            <h2 class="section-title" id="add-modal-title">เพิ่มรายการ</h2>
            <form id="transaction-form" autocomplete="off">
                <div class="form-group"><label for="description">รายละเอียด</label><input type="text" id="description" list="desc-suggestions" required enterkeyhint="next"></div>
                <div class="form-group"><label for="amount">จำนวนเงิน</label><input type="number" step="0.01" min="0.01" id="amount" inputmode="decimal" required></div>
                <div class="form-group"><label for="type">ประเภท</label><select id="type"><option value="รายรับ">รายรับ</option><option value="รายจ่าย">รายจ่าย</option><option value="รายจ่าย (บัตรเครดิต)">รายจ่าย (บัตรเครดิต)</option></select></div>
                <div class="form-group"><label for="transaction_date">วันที่</label><input type="date" id="transaction_date" required>
                    <div class="date-chips">
                        <button type="button" data-days-ago="0">วันนี้</button>
                        <button type="button" data-days-ago="1">เมื่อวาน</button>
                        <button type="button" data-days-ago="2">2 วันก่อน</button>
                    </div>
                </div>
                <div class="modal-actions" style="display:flex; gap: 15px; margin-top: 25px;">
                    <button type="button" onclick="closeAddModal()" style="background-color: #6c757d;">ยกเลิก</button>
                    <button type="submit" id="add-submit-btn">เพิ่มรายการ</button>
                </div>
            </form>
            <datalist id="desc-suggestions"></datalist>
        </div>
    </div>

    <div id="toast-host" aria-live="polite"></div>
    
    <!-- EDIT TRANSACTION MODAL -->
    <div id="edit-modal-container" class="modal-container hidden">
        <div class="modal-content">
            <h2 class="section-title">แก้ไขรายการ</h2>
            <form id="edit-transaction-form">
                <input type="hidden" id="edit-transaction-id">
                <div class="form-group"><label for="edit-type">ประเภท</label><select id="edit-type"><option value="รายรับ">รายรับ</option><option value="รายจ่าย">รายจ่าย</option><option value="รายจ่าย (บัตรเครดิต)">รายจ่าย (บัตรเครดิต)</option></select></div>
                <div class="form-group"><label for="edit-description">รายละเอียด</label><input type="text" id="edit-description" required></div>
                <div class="form-group"><label for="edit-amount">จำนวนเงิน</label><input type="number" step="0.01" min="0.01" id="edit-amount" inputmode="decimal" required></div>
                <div class="form-group"><label for="edit-transaction_date">วันที่</label><input type="date" id="edit-transaction_date" required></div>
                <div class="modal-actions" style="display:flex; gap: 15px; margin-top: 25px;">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()" style="background-color: #6c757d;">ยกเลิก</button>
                    <button type="submit">บันทึกการแก้ไข</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Javascript -->
    <script>
        const SUPABASE_URL = "https://fmbympgecspgqtnazrbm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYnltcGdlY3NwZ3F0bmF6cmJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA3NDkwOTksImV4cCI6MjA2NjMyNTA5OX0.rqOrNDNRTF7WnDS6utTTKfFoNZKPiMZV_ttqYzYCaJs";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allTransactions = [];
        let currentView = 'transactions';

        // === ส่วนที่เพิ่มสำหรับปักหมุด (Service Worker) ===
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Registration Failed', err));
            });
        }
        // ==========================================

        // DOM Elements
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const yearFilterEl = document.getElementById('year-filter');
        const monthFilterEl = document.getElementById('month-filter');
        const exportYearFilterEl = document.getElementById('export-year-filter');
        const transactionDateEl = document.getElementById('transaction_date');
        const transactionView = document.getElementById('transaction-view');
        const summaryView = document.getElementById('summary-view');
        const userEmailDisplay = document.getElementById('user-email-display');
        const editModalContainer = document.getElementById('edit-modal-container');

        // ---- AUTH ----
        const handleLogin = async (e) => { e.preventDefault(); const email = document.getElementById('login-email').value; const password = document.getElementById('login-password').value; const { error } = await db.auth.signInWithPassword({ email, password }); if (error) toast('เข้าสู่ระบบไม่สำเร็จ: ' + error.message, 'error'); };
        const handleLogout = async () => { const { error } = await db.auth.signOut(); if (error) console.error("Logout Error:", error); };
        
        // ---- CORE APP LOGIC ----
        // [FIX] วันที่วันนี้ตามเวลาเครื่อง (valueAsDate ใช้ UTC ทำให้ช่วง 00:00-06:59 กลายเป็นเมื่อวาน)
        const todayLocal = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

        // [FIX] กันข้อความถูกตีความเป็น HTML
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // ---- [NEW] Toast แจ้งเตือนแทน alert ----
        const toastHost = document.getElementById('toast-host');
        const toast = (message, kind = 'info', opts = {}) => {
            const el = document.createElement('div');
            el.className = `toast ${kind}`;
            const text = document.createElement('span');
            text.textContent = message;
            el.appendChild(text);
            let timer;
            const dismiss = () => { clearTimeout(timer); el.remove(); };
            if (opts.actionLabel && opts.onAction) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'toast-action';
                btn.textContent = opts.actionLabel;
                btn.onclick = () => { dismiss(); opts.onAction(); };
                el.appendChild(btn);
            }
            el.addEventListener('click', (ev) => { if (ev.target === el || ev.target === text) dismiss(); });
            toastHost.appendChild(el);
            while (toastHost.children.length > 2) toastHost.firstChild.remove();
            timer = setTimeout(dismiss, opts.duration ?? (kind === 'error' ? 5000 : 2500));
            return dismiss;
        };

        // ---- [NEW] จำค่าในเครื่อง (ถ้าใช้ไม่ได้ก็ข้ามไป) ----
        const store = {
            get: (k, fallback) => { try { const v = localStorage.getItem('puijod.' + k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
            set: (k, v) => { try { localStorage.setItem('puijod.' + k, JSON.stringify(v)); } catch {} },
        };

        // [FIX] ปิดปุ่ม submit ระหว่างบันทึก กันกดซ้ำแล้วได้รายการซ้ำ
        const withBusyForm = async (form, fn) => {
            const btn = form.querySelector('button[type="submit"]');
            if (btn && btn.disabled) return;
            const originalText = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = 'กำลังบันทึก...'; btn.style.opacity = '0.6'; }
            try { await fn(); }
            finally { if (btn) { btn.disabled = false; btn.textContent = originalText; btn.style.opacity = ''; } }
        };

        // [FIX] Supabase ส่งกลับสูงสุด 1,000 แถวต่อครั้ง จึงดึงทีละหน้าจนครบ
        const fetchAllTransactions = async () => {
            const PAGE_SIZE = 1000;
            let rows = [];
            let from = 0;
            while (true) {
                const { data, error } = await db.from('transactions').select('*')
                    .order('transaction_date', { ascending: true })
                    .order('id', { ascending: true })
                    .range(from, from + PAGE_SIZE - 1);
                if (error) { console.error('Error fetching transactions:', error); toast('โหลดข้อมูลไม่สำเร็จ: ' + error.message, 'error'); return; }
                rows = rows.concat(data);
                if (data.length < PAGE_SIZE) break;
                from += PAGE_SIZE;
            }
            allTransactions = rows.map(t => ({ ...t, amount: Number(t.amount) }));
            rebuildSuggestions();
            renderUI();
        };

        // ---- [NEW] รายละเอียดเติมให้เอง: จำรายการล่าสุดของแต่ละชื่อ ----
        let lastByDescription = new Map();
        const descKey = (s) => String(s ?? '').trim().toLowerCase();
        const rebuildSuggestions = () => {
            const sorted = allTransactions.slice().sort((a, b) =>
                a.transaction_date < b.transaction_date ? 1 : a.transaction_date > b.transaction_date ? -1 : (Number(b.id) || 0) - (Number(a.id) || 0));
            lastByDescription = new Map();
            for (const t of sorted) {
                const k = descKey(t.description);
                if (k && !lastByDescription.has(k)) lastByDescription.set(k, t);
            }
            const datalist = document.getElementById('desc-suggestions');
            datalist.innerHTML = '';
            let n = 0;
            for (const t of lastByDescription.values()) {
                if (n++ >= 300) break;
                const opt = document.createElement('option');
                opt.value = t.description;
                datalist.appendChild(opt);
            }
        };

        let amountAutoFilled = false;
        const applySuggestion = () => {
            const match = lastByDescription.get(descKey(document.getElementById('description').value));
            if (!match) return;
            const amountEl = document.getElementById('amount');
            if (amountEl.value === '' || amountAutoFilled) {
                amountEl.value = match.amount;
                amountAutoFilled = true;
            }
            document.getElementById('type').value = match.type;
        };

        // ---- [NEW] Modal เพิ่มรายการ ----
        const addModalContainer = document.getElementById('add-modal-container');
        let addIsDuplicate = false;
        const daysAgoLocal = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

        // prefill = รายการต้นแบบ (ใช้ตอนกด "ซ้ำ")
        window.openAddModal = (prefill = null) => {
            const form = document.getElementById('transaction-form');
            form.reset();
            amountAutoFilled = false;
            addIsDuplicate = !!prefill;
            transactionDateEl.value = todayLocal();
            if (prefill) {
                document.getElementById('description').value = prefill.description;
                document.getElementById('amount').value = prefill.amount;
                document.getElementById('type').value = prefill.type;
                document.getElementById('add-modal-title').textContent = 'ทำซ้ำรายการ';
                document.getElementById('add-submit-btn').textContent = 'บันทึก';
            } else {
                document.getElementById('type').value = store.get('lastType', 'รายจ่าย');
                document.getElementById('add-modal-title').textContent = 'เพิ่มรายการ';
                document.getElementById('add-submit-btn').textContent = 'เพิ่มรายการ';
            }
            addModalContainer.classList.remove('hidden');
            // ทำซ้ำ: ไม่เด้งคีย์บอร์ด ให้เลือกวันที่ได้เลย / เพิ่มใหม่: โฟกัสช่องรายละเอียด
            if (!prefill) setTimeout(() => document.getElementById('description').focus(), 50);
        };
        window.closeAddModal = () => { addModalContainer.classList.add('hidden'); };

        const addTransaction = async (e) => {
            e.preventDefault();
            const form = e.currentTarget;
            await withBusyForm(form, async () => {
                const amountValue = parseFloat(document.getElementById('amount').value);
                if (isNaN(amountValue) || amountValue <= 0) {
                    toast('กรุณาป้อนจำนวนเงินที่ถูกต้อง', 'error');
                    return;
                }
                const { data: { user } } = await db.auth.getUser();
                if (!user) { toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'error'); return; }
                const type = document.getElementById('type').value;
                const description = document.getElementById('description').value.trim();
                const newTransaction = { user_id: user.id, type, description, amount: amountValue, transaction_date: transactionDateEl.value };
                const { error } = await db.from('transactions').insert(newTransaction);
                if (error) { console.error('Error adding transaction:', error); toast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
                if (!addIsDuplicate) store.set('lastType', type);
                closeAddModal();
                form.reset();
                toast(`บันทึก "${description}" แล้ว ✓`, 'success');
                await fetchAllTransactions();
            });
        };

        // ---- [NEW] ลบทันที แล้วกด "เลิกทำ" ได้ ----
        const restorableFields = ({ user_id, type, description, amount, transaction_date }) => ({ user_id, type, description, amount, transaction_date });

        const removeTransaction = async (id) => {
            const target = allTransactions.find(t => String(t.id) === String(id));
            if (!target) return;
            const { error } = await db.from('transactions').delete().eq('id', id);
            if (error) { console.error('Error deleting transaction:', error); toast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
            toast(`ลบ "${target.description}" แล้ว`, 'info', {
                duration: 6000,
                actionLabel: 'เลิกทำ',
                onAction: async () => {
                    const { error: undoError } = await db.from('transactions').insert(restorableFields(target));
                    if (undoError) { toast('กู้คืนไม่สำเร็จ: ' + undoError.message, 'error'); return; }
                    toast('กู้คืนแล้ว ✓', 'success');
                    await fetchAllTransactions();
                },
            });
            await fetchAllTransactions();
        };

        // ---- [NEW] ทำซ้ำ: เปิดฟอร์มที่กรอกไว้ให้แล้ว เลือกวันที่ได้ ----
        const duplicateTransaction = (id) => {
            const source = allTransactions.find(t => String(t.id) === String(id));
            if (!source) return;
            closeSwipe();
            openAddModal(source);
        };
        
        // ---- EDIT MODAL LOGIC ----
        window.openEditModal = (id) => {
            const transaction = allTransactions.find(t => String(t.id) === String(id));
            if (!transaction) return;
            document.getElementById('edit-transaction-id').value = transaction.id;
            document.getElementById('edit-type').value = transaction.type;
            document.getElementById('edit-description').value = transaction.description;
            document.getElementById('edit-amount').value = transaction.amount;
            document.getElementById('edit-transaction_date').value = transaction.transaction_date;
            editModalContainer.classList.remove('hidden');
        };

        window.closeEditModal = () => { editModalContainer.classList.add('hidden'); };

        const handleUpdateTransaction = async (e) => {
            e.preventDefault();
            await withBusyForm(e.currentTarget, async () => {
                const amountValue = parseFloat(document.getElementById('edit-amount').value);
                if (isNaN(amountValue) || amountValue <= 0) {
                    toast('กรุณาป้อนจำนวนเงินที่ถูกต้อง', 'error');
                    return;
                }
                const id = document.getElementById('edit-transaction-id').value;
                const updatedTransaction = { type: document.getElementById('edit-type').value, description: document.getElementById('edit-description').value, amount: amountValue, transaction_date: document.getElementById('edit-transaction_date').value };
                const { error } = await db.from('transactions').update(updatedTransaction).eq('id', id);
                if (error) { console.error('Error updating transaction:', error); toast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
                closeEditModal();
                toast('บันทึกการแก้ไขแล้ว ✓', 'success');
                await fetchAllTransactions();
            });
        };

        // ---- UI & FILTERING & VIEW ----
        window.setView = (view) => {
            currentView = view;
            document.querySelectorAll('.view-toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.view-toggle-btn[onclick="setView('${view}')"]`).classList.add('active');
            transactionView.classList.toggle('hidden', view !== 'transactions');
            summaryView.classList.toggle('hidden', view !== 'summary');
            renderUI();
        };

        const renderUI = () => {
            if (!yearFilterEl.value || !monthFilterEl.value) return; 
            const selectedYear = parseInt(yearFilterEl.value);
            const selectedMonth = parseInt(monthFilterEl.value);
            const monthlyTransactions = allTransactions.filter(t => { const date = new Date(t.transaction_date); date.setMinutes(date.getMinutes() + date.getTimezoneOffset()); return date.getFullYear() === selectedYear && (date.getMonth() + 1) === selectedMonth; });
            const upToCurrentMonthTransactions = allTransactions.filter(t => { const transDate = new Date(t.transaction_date); transDate.setMinutes(transDate.getMinutes() + transDate.getTimezoneOffset()); const lastDayOfMonth = new Date(selectedYear, selectedMonth, 0); return transDate <= lastDayOfMonth; });
            updateDashboard(monthlyTransactions, upToCurrentMonthTransactions);
            updateMonthNavButtons();
            if (currentView === 'transactions') {
                const query = searchInputEl.value.trim();
                if (query) renderSearchResults(query);
                else renderTransactionList(monthlyTransactions.slice().sort(byDateDesc));
            } else {
                const yearlyTransactions = allTransactions.filter(t => { const date = new Date(t.transaction_date); date.setMinutes(date.getMinutes() + date.getTimezoneOffset()); return date.getFullYear() === selectedYear; });
                renderSummary(yearlyTransactions, selectedYear);
            }
        };
        
        // === JAVASCRIPT LOGIC UPDATED HERE ===
        const updateDashboard = (monthlyTransactions, upToCurrentMonthTransactions) => {
            const { income, totalExpense } = monthlyTransactions.reduce((acc, t) => {
                if (t.type === 'รายรับ') {
                    acc.income += t.amount;
                } else { // Handles both 'รายจ่าย' and 'รายจ่าย (บัตรเครดิต)'
                    acc.totalExpense += t.amount;
                }
                return acc;
            }, { income: 0, totalExpense: 0 });

            const difference = income - totalExpense;
            const cumulativeBalance = upToCurrentMonthTransactions.reduce((acc, t) => (t.type === 'รายรับ' ? acc + t.amount : acc - t.amount), 0);

            document.getElementById('balance').innerHTML = `฿${formatMoney(cumulativeBalance)}`;
            document.getElementById('total-income').innerHTML = `฿${formatMoney(income)}`;
            document.getElementById('total-expense').innerHTML = `฿${formatMoney(totalExpense)}`;

            const differenceEl = document.getElementById('monthly-difference');
            differenceEl.innerHTML = `฿${formatMoney(difference)}`;
            differenceEl.classList.toggle('positive', difference >= 0);
            differenceEl.classList.toggle('negative', difference < 0);
        };
        
        const byDateDesc = (a, b) =>
            a.transaction_date < b.transaction_date ? 1 : a.transaction_date > b.transaction_date ? -1 : (Number(b.id) || 0) - (Number(a.id) || 0);

        const transactionItemHTML = (t) => {
            const sign = t.type === 'รายรับ' ? '+' : '-';
            const itemClass = t.type === 'รายรับ' ? 'positive' : 'negative';
            const formattedDate = new Date(t.transaction_date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', calendar: 'buddhist', timeZone: 'UTC' });
            const id = esc(t.id);
            return `<div class="item-actions-behind">`
                + `<button type="button" class="dup-btn" tabindex="-1" onclick="duplicateTransaction('${id}')">ซ้ำ</button>`
                + `<button type="button" class="edit-btn" tabindex="-1" onclick="openEditModal('${id}')">แก้ไข</button>`
                + `<button type="button" class="delete-btn" tabindex="-1" onclick="removeTransaction('${id}')">ลบ</button>`
                + `</div>`
                + `<div class="item-front"><div class="item-details"><span class="item-name">${esc(t.description)}</span><span class="item-date">${formattedDate}</span></div>`
                + `<span class="item-amount ${itemClass}">${sign}฿${formatMoney(t.amount)}</span></div>`;
        };

        // ---- [NEW] ปัดซ้ายเพื่อโชว์เครื่องมือ (แตะเพื่อเปิด/ปิดก็ได้) ----
        const SWIPE_WIDTH = 216;
        let openFront = null;
        let swipe = null;
        const setActionsFocusable = (front, on) => {
            const behind = front.previousElementSibling;
            if (behind) behind.querySelectorAll('button').forEach(b => { b.tabIndex = on ? 0 : -1; });
        };
        const openSwipe = (front) => {
            if (openFront && openFront !== front) closeSwipe();
            front.style.transform = `translateX(-${SWIPE_WIDTH}px)`;
            front.classList.add('open');
            setActionsFocusable(front, true);
            openFront = front;
        };
        const closeSwipe = () => {
            if (!openFront) return;
            openFront.style.transform = '';
            openFront.classList.remove('open');
            setActionsFocusable(openFront, false);
            openFront = null;
        };
        const listRoot = document.getElementById('list');
        listRoot.addEventListener('pointerdown', (e) => {
            const front = e.target.closest('.item-front');
            if (!front || (e.pointerType === 'mouse' && e.button !== 0)) return;
            swipe = { front, id: e.pointerId, x0: e.clientX, y0: e.clientY, base: front === openFront ? -SWIPE_WIDTH : 0, dir: null, x: null };
        });
        listRoot.addEventListener('pointermove', (e) => {
            if (!swipe || e.pointerId !== swipe.id) return;
            const dx = e.clientX - swipe.x0;
            const dy = e.clientY - swipe.y0;
            if (swipe.dir === null) {
                if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                swipe.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
                if (swipe.dir === 'v') return;
                if (openFront && openFront !== swipe.front) closeSwipe();
                swipe.front.classList.add('dragging');
                try { swipe.front.setPointerCapture(e.pointerId); } catch {}
            }
            if (swipe.dir !== 'h') return;
            swipe.x = Math.min(0, Math.max(-SWIPE_WIDTH - 40, swipe.base + dx));
            swipe.front.style.transform = `translateX(${swipe.x}px)`;
        });
        const endSwipe = (e) => {
            if (!swipe || e.pointerId !== swipe.id) return;
            const s = swipe;
            swipe = null;
            s.front.classList.remove('dragging');
            if (s.dir === 'h') {
                if (s.x !== null && s.x < -SWIPE_WIDTH / 3) openSwipe(s.front);
                else { if (openFront === s.front) openFront = null; s.front.style.transform = ''; s.front.classList.remove('open'); setActionsFocusable(s.front, false); }
            } else if (s.dir === null && e.type === 'pointerup') {
                // แตะเฉย ๆ = เปิด/ปิด
                if (openFront === s.front) closeSwipe(); else openSwipe(s.front);
            }
        };
        listRoot.addEventListener('pointerup', endSwipe);
        listRoot.addEventListener('pointercancel', endSwipe);
        // แตะที่อื่น หรือกดปุ่มเครื่องมือแล้ว ให้ปิด
        document.addEventListener('click', (e) => {
            if (!openFront) return;
            if (e.target.closest('.item-front')) return;
            if (e.target.closest('.item-actions-behind')) { setTimeout(closeSwipe, 0); return; }
            closeSwipe();
        });

        // ---- [NEW] ค้นหาทุกเดือน ----
        const searchInputEl = document.getElementById('search-input');
        const renderSearchResults = (query) => {
            openFront = null;
            const listEl = document.getElementById('list');
            const q = query.toLowerCase();
            const matches = allTransactions.filter(t =>
                String(t.description ?? '').toLowerCase().includes(q) || formatMoney(t.amount).replace(/,/g, '').includes(q.replace(/,/g, ''))
            ).sort(byDateDesc);
            const income = matches.filter(t => t.type === 'รายรับ').reduce((s, t) => s + t.amount, 0);
            const expense = matches.filter(t => t.type !== 'รายรับ').reduce((s, t) => s + t.amount, 0);
            const LIMIT = 200;
            let html = `<div class="search-summary"><span>พบ ${matches.length} รายการ</span><span>${income ? `<span style="color:#80FFAF">+${formatMoney(income)}</span> ` : ''}${expense ? `<span style="color:#FF8A8A">-${formatMoney(expense)}</span>` : ''}</span></div>`;
            if (matches.length === 0) {
                html += '<p style="text-align: center; padding: 20px 0; background:#fff; color:#000; border: 2px solid #000; border-top: none;">ไม่พบรายการที่ตรงกับคำค้น</p>';
            } else {
                html += '<ul class="sub-list">' + matches.slice(0, LIMIT).map(t => `<li class="transaction-item">${transactionItemHTML(t)}</li>`).join('') + '</ul>';
                if (matches.length > LIMIT) html += `<p style="text-align:center; padding: 10px; background:#fff; color:#555; border: 2px solid #000; border-top: none;">แสดง ${LIMIT} รายการล่าสุด พิมพ์คำค้นให้ละเอียดขึ้นเพื่อดูที่เหลือ</p>`;
            }
            listEl.innerHTML = html;
        };

        // ---- [NEW] จำว่ากลุ่มไหนเปิดอยู่ ----
        const openGroups = new Set(store.get('openGroups', []));

        const renderTransactionList = (transactions) => {
            openFront = null;
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            if (transactions.length === 0) { listEl.innerHTML = '<p style="text-align: center; padding: 20px 0; background:#fff; color:#000;">ไม่พบรายการในเดือนนี้</p>'; return; }
            const groupedByType = transactions.reduce((groups, t) => { const type = t.type; if (!groups[type]) { groups[type] = []; } groups[type].push(t); return groups; }, {});
            const groupOrder = ['รายรับ', 'รายจ่าย', 'รายจ่าย (บัตรเครดิต)'];
            groupOrder.forEach(type => {
                if (!groupedByType[type]) return; 
                const groupContainer = document.createElement('div');
                const header = document.createElement('div');
                header.className = 'list-group-header';
                header.onclick = () => {
                    const nowHidden = subList.classList.toggle('hidden');
                    if (nowHidden) openGroups.delete(type); else openGroups.add(type);
                    store.set('openGroups', [...openGroups]);
                };
                const groupTotal = groupedByType[type].reduce((sum, t) => sum + t.amount, 0);
                const totalClass = type === 'รายรับ' ? 'positive' : 'negative';
                const totalSign = type === 'รายรับ' ? '+' : '-';
                header.innerHTML = `<span>${esc(type)}</span><span class="group-total ${totalClass}">${totalSign}${formatMoney(groupTotal)}</span>`;
                const subList = document.createElement('ul');
                subList.className = openGroups.has(type) ? 'sub-list' : 'sub-list hidden';
                groupedByType[type].forEach(t => {
                    const item = document.createElement('li');
                    item.className = 'transaction-item';
                    item.innerHTML = transactionItemHTML(t);
                    subList.appendChild(item);
                });
                groupContainer.appendChild(header);
                groupContainer.appendChild(subList);
                listEl.appendChild(groupContainer);
            });
        };

        const renderSummary = (yearlyTransactions, year) => {
            document.getElementById('summary-year-title').innerText = `พ.ศ. ${year + 543}`;
            const startDateOfYear = new Date(year, 0, 1);
            let runningBalance = allTransactions.filter(t => { const transDate = new Date(t.transaction_date); transDate.setMinutes(transDate.getMinutes() + transDate.getTimezoneOffset()); return transDate < startDateOfYear; }).reduce((acc, t) => (t.type === 'รายรับ' ? acc + t.amount : acc - t.amount), 0);
            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            let summaryData = Array(12).fill(0).map((_, i) => ({ month: thaiMonths[i], income: 0, expense: 0, credit: 0 }));
            yearlyTransactions.forEach(t => { const date = new Date(t.transaction_date); date.setMinutes(date.getMinutes() + date.getTimezoneOffset()); const monthIndex = date.getMonth(); if (t.type === 'รายรับ') summaryData[monthIndex].income += t.amount; else if (t.type === 'รายจ่าย') summaryData[monthIndex].expense += t.amount; else if (t.type === 'รายจ่าย (บัตรเครดิต)') summaryData[monthIndex].credit += t.amount; });
            const tableEl = document.getElementById('summary-table');
            let tableHTML = `<thead><tr style="background-color: #f0f0f0;"><th style="padding: 12px 8px; text-align: center;">เดือน</th><th style="padding: 12px 8px; text-align: center;">รายรับ</th><th style="padding: 12px 8px; text-align: center;">รายจ่าย</th><th style="padding: 12px 8px; text-align: center;">บัตรเครดิต</th><th style="padding: 12px 8px; text-align: center;">คงเหลือสะสม</th></tr></thead><tbody>`;
            let total = { income: 0, expense: 0, credit: 0 };
            summaryData.forEach(data => { 
                runningBalance += data.income - (data.expense + data.credit); 
                total.income += data.income; 
                total.expense += data.expense; 
                total.credit += data.credit; 
                tableHTML += `<tr style="border-bottom: 1px solid #ddd;">
                                <td style="text-align: left; padding: 12px 8px; font-weight: 500;">${data.month}</td>
                                <td class="positive" style="text-align: right; padding: 12px 8px;">${formatMoney(data.income)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(data.expense)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(data.credit)}</td>
                                <td class="${runningBalance >= 0 ? 'positive' : 'negative'}" style="text-align: right; padding: 12px 8px;">${formatMoney(runningBalance)}</td>
                              </tr>`; 
            });
            tableHTML += `</tbody><tfoot style="font-weight: bold; background-color: #f0f0f0;">
                            <tr>
                                <td style="text-align: left; padding: 12px 8px;">รวม</td>
                                <td class="positive" style="text-align: right; padding: 12px 8px;">${formatMoney(total.income)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(total.expense)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(total.credit)}</td>
                                <td class="${runningBalance >= 0 ? 'positive' : 'negative'}" style="text-align: right; padding: 12px 8px;">${formatMoney(runningBalance)}</td>
                            </tr>
                          </tfoot>`;
            tableEl.innerHTML = tableHTML;
        };

        const START_YEAR = 2024;

        const populateYearSelect = (selectEl, selectedYear) => {
            const now = new Date();
            const currentYear = now.getFullYear();
            selectEl.innerHTML = '';
            for (let i = currentYear + 1; i >= START_YEAR; i--) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i + 543;
                selectEl.appendChild(option);
            }
            selectEl.value = selectedYear ?? Math.max(currentYear, START_YEAR);
        };

        const populateDateFilters = () => {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            populateYearSelect(yearFilterEl, Math.max(currentYear, START_YEAR));
            populateYearSelect(exportYearFilterEl, Math.max(currentYear, START_YEAR));

            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            monthFilterEl.innerHTML = '';
            thaiMonths.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index + 1;
                option.textContent = month;
                monthFilterEl.appendChild(option);
            });
            
            monthFilterEl.value = currentMonth;
        };
        
        const formatMoney = (number) => Number(number).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');

        const XLSX_HEADERS = ['transaction_date', 'type', 'description', 'amount'];

        const excelSerialToDateString = (serial) => {
            const utcDays = Math.floor(serial) - 25569;
            const jsDate = new Date(utcDays * 86400000);
            const y = jsDate.getUTCFullYear();
            const m = String(jsDate.getUTCMonth() + 1).padStart(2, '0');
            const d = String(jsDate.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const parseThaiSlashDate = (value) => {
            const match = String(value).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
            if (!match) return null;
            const day = parseInt(match[1], 10);
            const month = parseInt(match[2], 10);
            let year = parseInt(match[3], 10);
            if (year < 100) {
                year = year >= 40 ? year + 2500 - 543 : 2000 + year;
            } else if (year > 2400) {
                year = year - 543;
            }
            if (month < 1 || month > 12 || day < 1 || day > 31) return null;
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        };

        const formatDateForSupabase = (excelDate) => {
            try {
                if (typeof excelDate === 'number') {
                    return excelSerialToDateString(excelDate);
                }
                if (excelDate instanceof Date && !isNaN(excelDate)) {
                    return excelSerialToDateString(25569 + excelDate.getTime() / 86400000);
                }
                if (typeof excelDate === 'string') {
                    if (/^\d{4}-\d{2}-\d{2}$/.test(excelDate)) return excelDate;
                    const thaiDate = parseThaiSlashDate(excelDate);
                    if (thaiDate) return thaiDate;
                }
                throw new Error('Invalid date format');
            } catch (e) {
                console.error('Could not parse date:', excelDate);
                return null;
            }
        };

        const getTransactionYear = (transactionDate) => parseInt(String(transactionDate).slice(0, 4), 10);

        const exportTemplate = () => { const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet([ XLSX_HEADERS ]); const dropdownOptions = '"รายรับ,รายจ่าย,รายจ่าย (บัตรเครดิต)"'; ws['!dataValidation'] = [{ sqref: 'B2:B1000', opts: { type: 'list', allowBlank: true, formula1: dropdownOptions, showDropDown: true, errorStyle: 'warning', error: 'กรุณาเลือกจากรายการ', errorTitle: 'ข้อมูลไม่ถูกต้อง' } }]; XLSX.utils.book_append_sheet(wb, ws, "Transactions"); XLSX.writeFile(wb, "template.xlsx"); };
        const exportData = () => {
            const exportYear = parseInt(exportYearFilterEl.value, 10);
            const filtered = allTransactions.filter(t => getTransactionYear(t.transaction_date) === exportYear);
            if (filtered.length === 0) {
                toast(`ไม่มีข้อมูลสำหรับ Export ในปี ${exportYear + 543}`, 'error');
                return;
            }
            const dataToExport = filtered.map(({ id, user_id, created_at, ...rest }) => ({ ...rest, transaction_date: rest.transaction_date }));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(dataToExport, { header: XLSX_HEADERS });
            XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
            XLSX.writeFile(wb, `transactions_${exportYear + 543}.xlsx`);
        };
        const importFromXLSX = (event) => { const file = event.target.files[0]; if (!file) { return; } const reader = new FileReader(); reader.onload = async (e) => { try { const data = e.target.result; const workbook = XLSX.read(data, { type: 'binary', cellDates: false }); const sheetName = workbook.SheetNames[0]; const worksheet = workbook.Sheets[sheetName]; const json = XLSX.utils.sheet_to_json(worksheet, { raw: true }); const { data: { user } } = await db.auth.getUser(); if (!user) { throw new Error("ไม่พบข้อมูลผู้ใช้"); } const newTransactions = []; const validTypes = ['รายรับ', 'รายจ่าย', 'รายจ่าย (บัตรเครดิต)']; for (const row of json) { const formattedDate = formatDateForSupabase(row.transaction_date); const amount = parseFloat(row.amount); const type = row.type ? String(row.type).trim() : null; if (formattedDate && type && validTypes.includes(type) && row.description && !isNaN(amount)) { newTransactions.push({ user_id: user.id, transaction_date: formattedDate, type: type, description: String(row.description), amount: amount, }); } else { console.warn('ข้ามแถวข้อมูลที่ไม่ถูกต้อง:', row); } } if (newTransactions.length > 0) { const { error } = await db.from('transactions').insert(newTransactions); if (error) { throw error; } toast(`นำเข้าข้อมูลสำเร็จ ${newTransactions.length} รายการ ✓`, 'success', { duration: 4000 }); await fetchAllTransactions(); } else { toast('ไม่พบข้อมูลที่ถูกต้องในไฟล์', 'error'); } } catch (error) { console.error('เกิดข้อผิดพลาดในการนำเข้า:', error); toast('เกิดข้อผิดพลาดในการนำเข้า: ' + error.message, 'error'); } finally { event.target.value = null; } }; reader.readAsBinaryString(file); };

        // ---- APP INITIALIZATION ----
        // [FIX] กันไม่ให้ initializeApp ทำงานซ้ำ (Supabase อาจส่ง SIGNED_IN ซ้ำตอนสลับแท็บ ทำให้ตัวกรองเด้งกลับเดือนปัจจุบัน)
        let appReady = false;
        const initializeApp = async () => {
            if (appReady) return;
            const { data: { session } } = await db.auth.getSession();
            if (appReady) return;
            if (session) {
                appReady = true;
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userEmailDisplay.textContent = session.user.email;
                transactionDateEl.value = todayLocal();
                populateDateFilters();
                await fetchAllTransactions();
            } else {
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        };
        db.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN') {
                // เรียกผ่าน setTimeout ตามคำแนะนำของ Supabase เพื่อไม่ให้ await ภายใน callback ค้าง
                setTimeout(initializeApp, 0);
            } else if (event === 'SIGNED_OUT') {
                appReady = false;
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
                allTransactions = [];
                userEmailDisplay.textContent = '';
                document.getElementById('list').innerHTML = '';
                document.getElementById('login-form').reset();
            }
        });

        // Event Listeners
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('logout-btn').addEventListener('click', handleLogout);
        document.getElementById('transaction-form').addEventListener('submit', addTransaction);
        document.getElementById('edit-transaction-form').addEventListener('submit', handleUpdateTransaction);
        yearFilterEl.addEventListener('change', () => {
            exportYearFilterEl.value = yearFilterEl.value;
            renderUI();
        });
        monthFilterEl.addEventListener('change', renderUI);
        document.getElementById('export-template-btn').addEventListener('click', exportTemplate);
        document.getElementById('export-data-btn').addEventListener('click', exportData);
        document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
        document.getElementById('import-file').addEventListener('change', importFromXLSX);

        // ---- [NEW] ปุ่ม ◀ ▶ เปลี่ยนเดือน ----
        const prevMonthBtn = document.getElementById('prev-month-btn');
        const nextMonthBtn = document.getElementById('next-month-btn');
        const hasYearOption = (y) => [...yearFilterEl.options].some(o => Number(o.value) === y);
        const shiftedMonth = (delta) => {
            let y = parseInt(yearFilterEl.value, 10);
            let m = parseInt(monthFilterEl.value, 10) + delta;
            if (m < 1) { m = 12; y -= 1; }
            if (m > 12) { m = 1; y += 1; }
            return { y, m };
        };
        const shiftMonth = (delta) => {
            const { y, m } = shiftedMonth(delta);
            if (!hasYearOption(y)) return;
            yearFilterEl.value = y;
            exportYearFilterEl.value = y;
            monthFilterEl.value = m;
            renderUI();
        };
        const updateMonthNavButtons = () => {
            prevMonthBtn.disabled = !hasYearOption(shiftedMonth(-1).y);
            nextMonthBtn.disabled = !hasYearOption(shiftedMonth(1).y);
        };
        prevMonthBtn.addEventListener('click', () => shiftMonth(-1));
        nextMonthBtn.addEventListener('click', () => shiftMonth(1));

        // ---- [NEW] ค้นหา ----
        const searchClearBtn = document.getElementById('search-clear');
        let searchTimer;
        searchInputEl.addEventListener('input', () => {
            searchClearBtn.classList.toggle('hidden', !searchInputEl.value);
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderUI, 150);
        });
        searchClearBtn.addEventListener('click', () => {
            searchInputEl.value = '';
            searchClearBtn.classList.add('hidden');
            renderUI();
            searchInputEl.focus();
        });

        // ---- [NEW] Modal เพิ่มรายการ + เติมให้เอง ----
        document.getElementById('add-fab').addEventListener('click', () => openAddModal());
        document.querySelectorAll('.date-chips button').forEach(btn => {
            btn.addEventListener('click', () => { transactionDateEl.value = daysAgoLocal(Number(btn.dataset.daysAgo)); });
        });
        const descriptionEl = document.getElementById('description');
        descriptionEl.addEventListener('input', applySuggestion);
        descriptionEl.addEventListener('change', applySuggestion);
        document.getElementById('amount').addEventListener('input', () => { amountAutoFilled = false; });

        // ---- [NEW] ปิด modal ด้วย Esc หรือแตะพื้นหลัง ----
        [addModalContainer, editModalContainer].forEach(container => {
            container.addEventListener('click', (ev) => { if (ev.target === container) container.classList.add('hidden'); });
        });
        document.addEventListener('keydown', (ev) => {
            if (ev.key !== 'Escape') return;
            addModalContainer.classList.add('hidden');
            editModalContainer.classList.add('hidden');
        });

        // ---- [NEW] ออกจากระบบแล้วล้างหน้าจอ ----
        db.auth.onAuthStateChange((event) => {
            if (event !== 'SIGNED_OUT') return;
            addModalContainer.classList.add('hidden');
            editModalContainer.classList.add('hidden');
            searchInputEl.value = '';
            searchClearBtn.classList.add('hidden');
            toastHost.innerHTML = '';
        });

        initializeApp();
    </script>
</body>
</html>
