<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUIJOD</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E52521">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/588/588257.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Press+Start+2P&display=swap');

        :root {
            --primary-color: #43B047;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --mario-red: #E52521;
            --mario-yellow: #FAC000;
            --mario-blue: #5C94FC;
            --mario-brown: #D97B00;
            --mario-dark-brown: #8C4516;
            --text-color-dark: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--mario-blue);
            background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
            color: var(--text-color-dark);
            padding: 2rem 0;
            image-rendering: pixelated;
        }
        .container { max-width: 840px; margin: auto; padding: 15px; }
        .hidden { display: none !important; }

        header { 
            text-align: center; margin-bottom: 30px; background: rgba(0,0,0,0.4);
            padding: 25px 20px; border: 4px solid #000;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        header h1 {
            font-family: 'Press Start 2P', cursive; color: var(--mario-yellow);
            text-shadow: 3px 3px #000; font-size: 2rem;
        }
        #logout-btn { 
            font-family: 'Press Start 2P', cursive; background-color: var(--mario-red); 
            color: white; padding: 10px 20px; border: 2px solid #000;
            box-shadow: 4px 4px 0px 0px var(--text-color-dark); cursor: pointer; border-radius: 8px;
        }
        .section {
            background: var(--mario-brown); padding: 25px; border-radius: 0;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8); margin-bottom: 25px; border: 4px solid #000; color: #fff;
        }
        .section-title { text-align: center; margin-bottom: 25px; font-size: 1.5rem; text-shadow: 2px 2px #000; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; text-shadow: 1px 1px #000; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 15px; border: 2px solid #000; border-radius: 0; font-family: 'Kanit';
        }
        button {
            display: block; width: 100%; padding: 14px; border: 2px solid #000;
            background-color: var(--primary-color); color: white; font-weight: 600; cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 25px; }
        .card { background: var(--mario-yellow); padding: 15px; border: 4px solid #000; text-align: center; }
        .card .amount { font-size: 1.2rem; font-weight: 700; color: #000; }
        
        .view-toggle { display: flex; margin-bottom: 25px; border: 2px solid #000; }
        .view-toggle-btn { flex: 1; padding: 10px; background: var(--mario-dark-brown); color: #fff; border: none; cursor: pointer; }
        .view-toggle-btn.active { background-color: var(--primary-color); }

        .list-group-header { background-color: var(--mario-dark-brown); padding: 15px; border: 2px solid #000; margin-top: 15px; display: flex; justify-content: space-between; }
        .sub-list { background: #fff; border: 2px solid #000; color: #000; }
        .transaction-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px dashed #ccc; }
        
        @media (min-width: 600px) { .dashboard { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth-container">
            <div id="login-view" class="section">
                <h2 class="section-title">เข้าสู่ระบบ</h2>
                <form id="login-form">
                    <div class="form-group"><label>อีเมล</label><input type="email" id="login-email" required></div>
                    <div class="form-group"><label>รหัสผ่าน</label><input type="password" id="login-password" required></div>
                    <button type="submit">START GAME</button>
                </form>
            </div>
        </div>

        <div id="app-container" class="hidden">
            <header>
                <h1>PUIJOD</h1>
                <p id="user-email-display"></p>
                <button id="logout-btn">QUIT</button>
            </header>

            <div class="filter-section section" style="display:flex; gap: 10px;">
                <select id="year-filter" style="flex:1; padding:10px; border:2px solid #000;"></select>
                <select id="month-filter" style="flex:1; padding:10px; border:2px solid #000;"></select>
            </div>
            
            <div class="dashboard">
                <div class="card"><h3>คงเหลือ</h3><p class="amount" id="balance">฿0.00</p></div>
                <div class="card"><h3>รายรับ</h3><p class="amount" id="total-income">฿0.00</p></div>
                <div class="card"><h3>รายจ่าย</h3><p class="amount" id="total-expense">฿0.00</p></div>
                <div class="card"><h3>ผลต่าง</h3><p class="amount" id="monthly-difference">฿0.00</p></div>
            </div>

            <div class="view-toggle">
                <button class="view-toggle-btn active" onclick="setView('transactions')">รายการ</button>
                <button class="view-toggle-btn" onclick="setView('summary')">สรุปปี</button>
            </div>

            <div id="transaction-view">
                <div class="section"><div id="list"></div></div>
            </div>

            <div id="summary-view" class="hidden">
                <div class="section">
                    <h2 class="section-title">สรุปรายปี</h2>
                    <div style="overflow-x:auto; background: #fff; color: #000; padding: 10px;">
                        <table id="summary-table" style="width: 100%; border-collapse: collapse; font-size: 0.9rem;"></table>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">เพิ่มรายการ</h2>
                <form id="transaction-form">
                    <div class="form-group"><select id="type"><option value="รายรับ">รายรับ</option><option value="รายจ่าย">รายจ่าย</option><option value="รายจ่าย (บัตรเครดิต)">รายจ่าย (บัตรเครดิต)</option></select></div>
                    <div class="form-group"><input type="text" id="description" placeholder="รายละเอียด" required></div>
                    <div class="form-group"><input type="number" step="0.01" id="amount" placeholder="จำนวนเงิน" required></div>
                    <div class="form-group"><input type="date" id="transaction_date" required></div>
                    <button type="submit">INSERT COIN</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://fmbympgecspgqtnazrbm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYnltcGdlY3NwZ3F0bmF6cmJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA3NDkwOTksImV4cCI6MjA2NjMyNTA5OX0.rqOrNDNRTF7WnDS6utTTKfFoNZKPiMZV_ttqYzYCaJs";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allTransactions = [];
        let currentView = 'transactions';

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => console.log('SW Registered'));
            });
        }

        async function initializeApp() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('user-email-display').textContent = session.user.email;
                populateDateFilters();
                await fetchTransactions();
            }
        }

        async function fetchTransactions() {
            const { data, error } = await db.from('transactions').select('*').order('transaction_date', { ascending: false });
            if (!error) { allTransactions = data; renderUI(); }
        }

        function populateDateFilters() {
            const now = new Date();
            const yearEl = document.getElementById('year-filter');
            const monthEl = document.getElementById('month-filter');
            for (let i = now.getFullYear(); i >= 2024; i--) {
                yearEl.innerHTML += `<option value="${i}">${i+543}</option>`;
            }
            const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
            months.forEach((m, i) => {
                monthEl.innerHTML += `<option value="${i+1}" ${i === now.getMonth() ? 'selected' : ''}>${m}</option>`;
            });
        }

        function formatMoney(n) { return Number(n).toLocaleString(undefined, {minimumFractionDigits: 2}); }

        function renderUI() {
            const year = parseInt(document.getElementById('year-filter').value);
            const month = parseInt(document.getElementById('month-filter').value);
            
            const monthly = allTransactions.filter(t => {
                const d = new Date(t.transaction_date);
                return d.getUTCFullYear() === year && (d.getUTCMonth() + 1) === month;
            });

            const income = monthly.filter(t => t.type === 'รายรับ').reduce((s, t) => s + t.amount, 0);
            const expense = monthly.filter(t => t.type !== 'รายรับ').reduce((s, t) => s + t.amount, 0);
            
            document.getElementById('total-income').textContent = '฿' + formatMoney(income);
            document.getElementById('total-expense').textContent = '฿' + formatMoney(expense);
            document.getElementById('monthly-difference').textContent = '฿' + formatMoney(income - expense);

            const listEl = document.getElementById('list');
            listEl.innerHTML = monthly.map(t => `
                <div class="transaction-item">
                    <div><b>${t.description}</b><br><small>${t.type}</small></div>
                    <div style="color:${t.type === 'รายรับ' ? 'green' : 'red'}">${t.type === 'รายรับ' ? '+' : '-'}฿${formatMoney(t.amount)}</div>
                </div>
            `).join('') || '<p style="color:#000; text-align:center">ไม่มีข้อมูล</p>';
        }

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) alert(error.message); else initializeApp();
        };

        document.getElementById('transaction-form').onsubmit = async (e) => {
            e.preventDefault();
            const { data: { user } } = await db.auth.getUser();
            const payload = {
                user_id: user.id,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                amount: parseFloat(document.getElementById('amount').value),
                transaction_date: document.getElementById('transaction_date').value
            };
            await db.from('transactions').insert(payload);
            location.reload();
        };

        document.getElementById('logout-btn').onclick = () => { db.auth.signOut(); location.reload(); };
        document.getElementById('year-filter').onchange = renderUI;
        document.getElementById('month-filter').onchange = renderUI;

        window.setView = (v) => {
            currentView = v;
            document.getElementById('transaction-view').className = v === 'transactions' ? '' : 'hidden';
            document.getElementById('summary-view').className = v === 'summary' ? '' : 'hidden';
            document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(v === 'transactions' ? 'รายการ' : 'สรุป')));
        };

        initializeApp();
    </script>
</body>
</html>
