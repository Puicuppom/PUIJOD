<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUIJOD - Mario Block Edition</title>
    
    <!-- === ส่วนที่เพิ่มสำหรับปักหมุด (PWA) === -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E52521">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <!-- =================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Press+Start+2P&display=swap');

        :root {
            /* << --- VIBRANT COLORS UPDATED --- >> */
            --primary-color: #43B047; /* Mario Green */
            --danger-color: #b91c1c;  /* [FIX] เข้มขึ้น อ่านง่ายบนพื้นเหลือง/ขาว */
            --success-color: #15803d; /* [FIX] เข้มขึ้น อ่านง่ายบนพื้นเหลือง/ขาว */
            
            --mario-red: #E52521;
            --mario-yellow: #FAC000;
            --mario-blue: #5C94FC;
            --mario-brown: #D97B00;
            --mario-dark-brown: #8C4516;
            --text-color-dark: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--mario-blue);
            background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
            color: var(--text-color-dark);
            padding: 2rem 0;
            image-rendering: pixelated;
        }
        
        .container { 
            max-width: 840px;
            margin: auto; 
            padding: 15px; 
        }
        .hidden { display: none !important; }

        /* --- MARIO HEADER --- */
        header { 
            text-align: center; 
            margin-bottom: 30px;
            background: rgba(0,0,0,0.4);
            padding: 25px 20px;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        header h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--mario-yellow);
            text-shadow: 3px 3px #000;
            font-size: 2rem;
            line-height: 1.2;
        }
        header p#user-email-display { 
            color: #fff; 
            font-size: 0.9rem; 
            word-break: break-all;
            font-family: 'Kanit', sans-serif;
        }
        #logout-btn { 
            font-family: 'Press Start 2P', cursive;
            background-color: var(--mario-red); 
            color: white;
            width: auto; 
            padding: 10px 20px; 
            display: inline-block; 
            font-size: 0.9rem;
            border: 2px solid #000;
            box-shadow: 4px 4px 0px 0px var(--text-color-dark);
            cursor: pointer;
            transition: all 0.1s ease-out;
            border-radius: 8px;
        }
        #logout-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        /* --- 8-BIT BLOCK SECTIONS --- */
        .section {
            background: var(--mario-brown);
            padding: 25px;
            border-radius: 0;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            border: 4px solid #000;
            color: #fff;
        }
        .section-title {
            text-align: center;
            margin-bottom: 25px;
            color: #fff;
            font-weight: 600;
            font-size: 1.5rem;
            text-shadow: 2px 2px #000;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            text-shadow: 1px 1px #000;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #000;
            border-radius: 0;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.5);
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            border: 2px solid #000;
            border-radius: 0;
            background-color: var(--primary-color);
            color: white;
            font-family: 'Kanit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease-out;
        }
        button:active { 
            transform: translate(4px, 4px);
            box-shadow: none;
        }
        
        .positive { color: var(--success-color) !important; font-weight: bold; }
        .negative { color: var(--danger-color) !important; font-weight: bold; }

        .dashboard { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 25px;
        }
        
        .card {
            background: var(--mario-yellow);
            padding: 20px;
            border-radius: 0;
            border: 4px solid #000;
            text-align: center;
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.8);
        }
        .card h3 { 
            font-size: 0.9rem; 
            color: rgba(0,0,0,0.8); 
            font-weight: 500; 
            margin-bottom: 12px;
        }
        .card .amount { 
            font-size: 1.4rem; /* << --- FONT SIZE ADJUSTED --- >> */
            font-weight: 700;
            color: #000;
            word-break: break-all;
        }
        
        .view-toggle { 
            display: flex; 
            margin-bottom: 25px; 
            border: 2px solid #000;
        }
        .view-toggle-btn { 
            flex: 1; 
            padding: 10px; 
            background: var(--mario-dark-brown); 
            border: none;
            border-left: 2px solid #000;
            cursor: pointer; 
            font-family: 'Kanit'; 
            font-size: 1rem; 
            color: #fff; 
            font-weight: 500; 
        }
        .view-toggle-btn:first-child { border-left: none; }
        .view-toggle-btn.active { 
            background-color: var(--primary-color); 
            color: white;
            font-weight: 600;
        }

        .list-group-header {
            background-color: var(--mario-dark-brown);
            padding: 15px 20px;
            border: 2px solid #000;
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        /* Override positive/negative colors for the header for better contrast */
        .list-group-header .positive { color: #80FFAF !important; }
        .list-group-header .negative { color: #FF8A8A !important; }
        
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 2px dashed #000;
            color: #000;
        }
        .sub-list { 
            background: #fff; 
            border: 2px solid #000;
            border-top: none;
        }
        
        .modal-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { 
            background: var(--mario-brown);
            padding: 30px; 
            border: 4px solid #000;
            width: 100%; 
            max-width: 500px; 
            color: #fff;
        }
        
        @media (min-width: 600px) {
            .dashboard { grid-template-columns: repeat(4, 1fr); }
        }
        /* === MODIFIED FOR MOBILE VIEW === */
        @media (max-width: 480px) {
            .dashboard { grid-template-columns: repeat(2, 1fr); } /* ปรับเป็น 2 คอลัมน์สำหรับมือถือ */
        }

        /* === [NEW] ความสะดวก === */
        #app-container { padding-bottom: 90px; }

        /* ปุ่ม + ลอย (บล็อก ? สไตล์มาริโอ้) */
        .fab {
            position: fixed; right: 20px; bottom: 20px; z-index: 90;
            width: 64px; height: 64px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--mario-yellow); color: #000;
            font-family: 'Press Start 2P', cursive; font-size: 1.6rem; line-height: 1;
            border: 4px solid #000; box-shadow: 4px 4px 0 #000;
        }
        .fab:active { transform: translate(4px, 4px); box-shadow: none; }

        /* แถบเลือกเดือน */
        .month-nav { display: flex; gap: 10px; align-items: flex-end; }
        .month-nav .form-group { flex: 1; min-width: 0; margin-bottom: 0; }
        .month-nav .form-group select { padding: 12px 4px; font-size: 0.95rem; }
        .month-nav { gap: 8px; }
        .month-nav .nav-btn { width: 40px; flex-basis: 40px; }
        .month-nav .nav-btn {
            width: 48px; flex: 0 0 48px; height: 46px; padding: 0;
            background: var(--mario-dark-brown); font-size: 1.1rem;
        }
        .month-nav .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ช่องค้นหา */
        .search-box { position: relative; margin-bottom: 15px; }
        .search-box input::-webkit-search-cancel-button { display: none; }
        .search-box input {
            width: 100%; padding: 12px 44px 12px 15px; border: 2px solid #000;
            font-family: 'Kanit', sans-serif; font-size: 1rem; box-shadow: inset 2px 2px 0 rgba(0,0,0,0.5);
        }
        .search-box .clear-btn {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 32px; height: 32px; padding: 0; box-shadow: none; border: none;
            background: transparent; color: #000; font-size: 1.2rem;
        }
        .search-summary {
            background: var(--mario-dark-brown); border: 2px solid #000; padding: 10px 15px;
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-weight: 600;
        }

        /* รายการแบบปัดซ้ายเพื่อโชว์เครื่องมือ */
        .transaction-item {
            display: block; position: relative; overflow: hidden; padding: 0;
            list-style: none; background: #fff;
        }
        .item-front {
            position: relative; z-index: 1; background: #fff;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            padding: 14px 12px; cursor: pointer;
            touch-action: pan-y; user-select: none; -webkit-user-select: none;
            transition: transform 0.2s ease-out;
        }
        .item-front.dragging { transition: none; }
        .item-front.open { box-shadow: 3px 0 0 #000; }
        .item-details { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .item-name { font-weight: 500; overflow-wrap: anywhere; }
        .item-date { font-size: 0.85rem; color: #555; }
        .item-amount { font-weight: 600; white-space: nowrap; }
        .item-actions-behind {
            position: absolute; top: 0; right: 0; bottom: 0; width: 216px; display: flex;
        }
        .item-actions-behind button {
            flex: 1; width: auto; height: 100%; padding: 0; border: none; border-radius: 0;
            border-left: 2px solid #000; box-shadow: none; color: #fff; font-size: 0.95rem;
        }
        .item-actions-behind button:active { transform: none; filter: brightness(0.85); }
        .item-actions-behind .dup-btn { background: #2563eb; }
        .item-actions-behind .edit-btn { background: #d97706; }
        .item-actions-behind .delete-btn { background: #dc2626; }
        .swipe-hint { text-align: center; font-size: 0.85rem; margin: -12px 0 14px; opacity: 0.85; text-shadow: 1px 1px #000; }

        /* ปุ่มเลือกวันที่ด่วน */
        .date-chips { display: flex; gap: 8px; margin-top: 8px; }
        .date-chips button {
            width: auto; padding: 6px 12px; font-size: 0.9rem; font-weight: 500;
            background: var(--mario-dark-brown); box-shadow: 2px 2px 0 #000;
        }
        .date-chips button:active { transform: translate(2px, 2px); box-shadow: none; }

        /* Toast แจ้งเตือน */
        #toast-host {
            position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
            z-index: 200; display: flex; flex-direction: column; gap: 8px;
            width: calc(100% - 32px); max-width: 420px; pointer-events: none;
        }
        .toast {
            pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: #fff; color: #000; border: 3px solid #000; box-shadow: 4px 4px 0 #000;
            padding: 10px 14px; font-weight: 500; animation: toast-in 0.15s ease-out;
        }
        .toast.success { background: #dcfce7; }
        .toast.error { background: #fee2e2; }
        .toast .toast-action {
            width: auto; padding: 6px 12px; font-size: 0.9rem; flex: 0 0 auto;
            background: var(--mario-red); box-shadow: 2px 2px 0 #000;
        }
        @keyframes toast-in { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
        /* === [NEW v3] === */
        .modal-content { max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; }

        /* ปุ่มประเภทแตะเดียว */
        .type-seg { display: flex; border: 2px solid #000; box-shadow: 2px 2px 0 #000; }
        .type-seg button {
            flex: 1; width: auto; padding: 11px 4px; border: none; border-left: 2px solid #000;
            box-shadow: none; background: #fff; color: #000; font-size: 0.95rem; font-weight: 500;
        }
        .type-seg button:first-child { border-left: none; }
        .type-seg button:active { transform: none; }
        .type-seg button.active[data-type="รายรับ"] { background: #15803d; color: #fff; font-weight: 600; }
        .type-seg button.active[data-type="รายจ่าย"] { background: #b91c1c; color: #fff; font-weight: 600; }
        .type-seg button.active[data-type="รายจ่าย (บัตรเครดิต)"] { background: #7c3aed; color: #fff; font-weight: 600; }

        /* ชิปรายการบ่อย */
        .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .quick-chips:empty { display: none; }
        .quick-chips button {
            width: auto; padding: 7px 12px; font-size: 0.9rem; font-weight: 500;
            background: #fff; color: #000; border: 2px solid #000; box-shadow: 2px 2px 0 #000;
        }
        .quick-chips button small { color: #555; margin-left: 4px; }
        .quick-chips button:active { transform: translate(2px, 2px); box-shadow: none; }

        /* ซ้ำทุกเดือน */
        .recur-box { margin-top: 18px; border: 2px dashed rgba(0,0,0,0.6); padding: 12px; background: rgba(0,0,0,0.12); }
        .recur-toggle { display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; margin: 0; }
        .recur-toggle input { width: 22px; height: 22px; accent-color: var(--mario-red); }
        .recur-row { display: flex; gap: 12px; margin-top: 12px; }
        .recur-row .form-group { flex: 1; margin-bottom: 0; }
        .recur-note { font-size: 0.8rem; margin-top: 8px; opacity: 0.9; }
        .recur-preview { font-size: 0.9rem; margin-top: 6px; font-weight: 500; background: #fff; color: #000; padding: 8px 10px; border: 2px solid #000; }
        .recur-preview:empty { display: none; }

        /* รายการแบบรายวัน */
        .day-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--mario-dark-brown); color: #fff; border: 2px solid #000;
            padding: 8px 12px; margin-top: 12px; font-weight: 600; font-size: 0.95rem;
        }
        .day-header:first-child { margin-top: 0; }
        .day-header .positive { color: #80FFAF !important; }
        .day-header .negative { color: #FF8A8A !important; }
        .item-tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 6px; border: 1.5px solid currentColor; margin-right: 6px; vertical-align: 1px; }
        .item-tag.credit { color: #7c3aed; }
        .item-tag.income { color: #15803d; }

        /* คัดลอกทั้งเดือน */
        .copy-month-btn { margin-bottom: 15px; background: var(--mario-dark-brown); font-size: 0.95rem; padding: 10px; }
        .copy-from { font-weight: 500; margin-bottom: 12px; }
        .copy-target { margin-bottom: 12px; }
        .copy-quick { display: flex; gap: 8px; margin-bottom: 10px; }
        .copy-quick button { width: auto; flex: 1; padding: 7px 6px; font-size: 0.85rem; background: var(--mario-dark-brown); box-shadow: 2px 2px 0 #000; }
        .copy-list { list-style: none; background: #fff; color: #000; border: 2px solid #000; max-height: 42vh; overflow-y: auto; }
        .copy-list li { border-bottom: 1px dashed #999; }
        .copy-list li:last-child { border-bottom: none; }
        .copy-list label { display: flex; align-items: center; gap: 10px; padding: 10px; margin: 0; cursor: pointer; color: #000; font-weight: 400; }
        .copy-list input { width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--mario-red); }
        .copy-list .c-desc { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .copy-list .c-day { color: #555; font-size: 0.8rem; display: block; }
        .copy-list .c-amt { font-weight: 600; white-space: nowrap; }
        .copy-list .c-exists { font-size: 0.75rem; color: #b45309; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- AUTH CONTAINER -->
        <div id="auth-container">
            <div id="login-view" class="section auth-form">
                <h2 class="section-title">เข้าสู่ระบบ</h2>
                <form id="login-form">
                    <div class="form-group"><label for="login-email">อีเมล</label><input type="email" id="login-email" required></div>
                    <div class="form-group"><label for="login-password">รหัสผ่าน</label><input type="password" id="login-password" required></div>
                    <button type="submit">เข้าสู่ระบบ</button>
                </form>
            </div>
        </div>

        <!-- MAIN APP CONTAINER -->
        <div id="app-container" class="hidden">
            <!-- MARIO HEADER -->
            <header>
                <h1>PUIJOD COINS</h1>
                <p id="user-email-display"></p>
                <button id="logout-btn">QUIT</button>
            </header>

            <!-- === DATE FILTER MOVED HERE === -->
            <div class="filter-section section month-nav">
                <button type="button" class="nav-btn" id="prev-month-btn" aria-label="เดือนก่อนหน้า">◀</button>
                <div class="form-group"><label for="year-filter">ปี</label><select id="year-filter"></select></div>
                <div class="form-group"><label for="month-filter">เดือน</label><select id="month-filter"></select></div>
                <button type="button" class="nav-btn" id="next-month-btn" aria-label="เดือนถัดไป">▶</button>
            </div>
            
            <!-- MARIO DASHBOARD -->
            <div class="dashboard">
                <div class="card"><h3>คงเหลือ (สะสม)</h3><p class="amount" id="balance">฿0.00</p></div>
                <div class="card"><h3>รายรับ <span class="month-label"></span></h3><p class="amount" id="total-income">฿0.00</p></div>
                <div class="card"><h3>รายจ่าย <span class="month-label"></span></h3><p class="amount" id="total-expense">฿0.00</p></div>
                <!-- === MODIFIED CARD === -->
                <div class="card"><h3>ผลต่าง <span class="month-label"></span></h3><p class="amount" id="monthly-difference">฿0.00</p></div>
            </div>

            <div class="view-toggle">
                <button class="view-toggle-btn active" onclick="setView('transactions')">ดูรายการ</button>
                <button class="view-toggle-btn" onclick="setView('summary')">ดูสรุป</button>
            </div>

            <div id="transaction-view">
                <!-- Date filter was removed from here -->
                <div class="section">
                    <h2 class="section-title">ประวัติรายการ</h2>
                    <p class="swipe-hint">ปัดซ้ายหรือแตะรายการ เพื่อ ซ้ำ / แก้ไข / ลบ</p>
                    <div class="search-box">
                        <input type="search" id="search-input" placeholder="🔍 ค้นหาทุกเดือน เช่น กาแฟ, Grab" autocomplete="off" enterkeyhint="search">
                        <button type="button" class="clear-btn hidden" id="search-clear" aria-label="ล้างคำค้น">✕</button>
                    </div>
                    <button type="button" class="copy-month-btn" id="copy-month-btn">📋 คัดลอกรายการเดือนนี้ไปเดือนอื่น</button>
                    <div id="list"></div>
                </div>
            </div>

            <div id="summary-view" class="hidden">
                <div class="section">
                    <h2 class="section-title">สรุปรายปี <span id="summary-year-title"></span></h2>
                    <div style="overflow-x:auto; background: #fff; color: #000; padding: 10px; border: 2px solid #000;">
                        <table id="summary-table" style="width: 100%; border-collapse: collapse;"></table>
                    </div>
                </div>
            </div>

             <div class="section actions-section">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="export-year-filter">ปีที่ Export</label>
                    <select id="export-year-filter"></select>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                    <button class="action-btn" id="export-template-btn" style="background-color: #6c757d;">Export Template</button>
                    <button class="action-btn" id="export-data-btn" style="background-color: #6c757d;">Export Data</button>
                    <button class="action-btn" id="import-btn" style="background-color: #6c757d;">Import XLSX</button>
                </div>
                <input type="file" id="import-file" class="hidden" accept=".xlsx, .xls">
            </div>

            <!-- [NEW] ปุ่ม + ลอย -->
            <button type="button" class="fab" id="add-fab" aria-label="เพิ่มรายการ">+</button>
        </div>
    </div>

    <!-- [NEW] ADD TRANSACTION MODAL -->
    <div id="add-modal-container" class="modal-container hidden">
        <div class="modal-content">
            <h2 class="section-title" id="add-modal-title">เพิ่มรายการ</h2>
            <form id="transaction-form" autocomplete="off">
