    <!-- Javascript -->
    <script>
        const SUPABASE_URL = "https://fmbympgecspgqtnazrbm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtYnltcGdlY3NwZ3F0bmF6cmJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA3NDkwOTksImV4cCI6MjA2NjMyNTA5OX0.rqOrNDNRTF7WnDS6utTTKfFoNZKPiMZV_ttqYzYCaJs";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allTransactions = [];
        let currentView = 'transactions';

        // === ส่วนที่เพิ่มสำหรับปักหมุด (Service Worker) ===
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Registration Failed', err));
            });
        }
        // ==========================================

        // DOM Elements
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const yearFilterEl = document.getElementById('year-filter');
        const monthFilterEl = document.getElementById('month-filter');
        const exportYearFilterEl = document.getElementById('export-year-filter');
        const transactionDateEl = document.getElementById('transaction_date');
        const transactionView = document.getElementById('transaction-view');
        const summaryView = document.getElementById('summary-view');
        const userEmailDisplay = document.getElementById('user-email-display');
        const editModalContainer = document.getElementById('edit-modal-container');

        // ---- AUTH ----
        const handleLogin = async (e) => { e.preventDefault(); const email = document.getElementById('login-email').value; const password = document.getElementById('login-password').value; const { error } = await db.auth.signInWithPassword({ email, password }); if (error) toast('เข้าสู่ระบบไม่สำเร็จ: ' + error.message, 'error'); };
        const handleLogout = async () => { const { error } = await db.auth.signOut(); if (error) console.error("Logout Error:", error); };
        
        // ---- CORE APP LOGIC ----
        // [FIX] วันที่วันนี้ตามเวลาเครื่อง (valueAsDate ใช้ UTC ทำให้ช่วง 00:00-06:59 กลายเป็นเมื่อวาน)
        const todayLocal = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

        // [FIX] กันข้อความถูกตีความเป็น HTML
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // ---- [NEW] Toast แจ้งเตือนแทน alert ----
        const toastHost = document.getElementById('toast-host');
        const toast = (message, kind = 'info', opts = {}) => {
            const el = document.createElement('div');
            el.className = `toast ${kind}`;
            const text = document.createElement('span');
            text.textContent = message;
            el.appendChild(text);
            let timer;
            const dismiss = () => { clearTimeout(timer); el.remove(); };
            if (opts.actionLabel && opts.onAction) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'toast-action';
                btn.textContent = opts.actionLabel;
                btn.onclick = () => { dismiss(); opts.onAction(); };
                el.appendChild(btn);
            }
            el.addEventListener('click', (ev) => { if (ev.target === el || ev.target === text) dismiss(); });
            toastHost.appendChild(el);
            while (toastHost.children.length > 2) toastHost.firstChild.remove();
            timer = setTimeout(dismiss, opts.duration ?? (kind === 'error' ? 5000 : 2500));
            return dismiss;
        };

        // ---- [NEW] จำค่าในเครื่อง (ถ้าใช้ไม่ได้ก็ข้ามไป) ----
        const store = {
            get: (k, fallback) => { try { const v = localStorage.getItem('puijod.' + k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
            set: (k, v) => { try { localStorage.setItem('puijod.' + k, JSON.stringify(v)); } catch {} },
        };

        // [FIX] ปิดปุ่ม submit ระหว่างบันทึก กันกดซ้ำแล้วได้รายการซ้ำ
        const withBusyForm = async (form, fn) => {
            const btn = form.querySelector('button[type="submit"]');
            if (btn && btn.disabled) return;
            const originalText = btn ? btn.textContent : '';
            if (btn) { btn.disabled = true; btn.textContent = 'กำลังบันทึก...'; btn.style.opacity = '0.6'; }
            try { await fn(); }
            finally { if (btn) { btn.disabled = false; btn.textContent = originalText; btn.style.opacity = ''; } }
        };

        // [FIX] Supabase ส่งกลับสูงสุด 1,000 แถวต่อครั้ง จึงดึงทีละหน้าจนครบ
        const fetchAllTransactions = async () => {
            const PAGE_SIZE = 1000;
            let rows = [];
            let from = 0;
            while (true) {
                const { data, error } = await db.from('transactions').select('*')
                    .order('transaction_date', { ascending: true })
                    .order('id', { ascending: true })
                    .range(from, from + PAGE_SIZE - 1);
                if (error) { console.error('Error fetching transactions:', error); toast('โหลดข้อมูลไม่สำเร็จ: ' + error.message, 'error'); return; }
                rows = rows.concat(data);
                if (data.length < PAGE_SIZE) break;
                from += PAGE_SIZE;
            }
            allTransactions = rows.map(t => ({ ...t, amount: Number(t.amount) }));
            refreshYearOptions();
            rebuildSuggestions();
            renderUI();
        };

        // ---- [NEW] รายละเอียดเติมให้เอง: จำรายการล่าสุดของแต่ละชื่อ ----
        let lastByDescription = new Map();
        const descKey = (s) => String(s ?? '').trim().toLowerCase();
        const rebuildSuggestions = () => {
            const sorted = allTransactions.slice().sort((a, b) =>
                a.transaction_date < b.transaction_date ? 1 : a.transaction_date > b.transaction_date ? -1 : (Number(b.id) || 0) - (Number(a.id) || 0));
            lastByDescription = new Map();
            for (const t of sorted) {
                const k = descKey(t.description);
                if (k && !lastByDescription.has(k)) lastByDescription.set(k, t);
            }
            const datalist = document.getElementById('desc-suggestions');
            datalist.innerHTML = '';
            let n = 0;
            for (const t of lastByDescription.values()) {
                if (n++ >= 300) break;
                const opt = document.createElement('option');
                opt.value = t.description;
                datalist.appendChild(opt);
            }
            // [NEW] รายการบ่อย 6 อันดับ (90 วันล่าสุด; ถ้าน้อยไปใช้ทั้งหมด)
            const since = daysAgoLocal(90);
            const countBy = (list) => { const m = new Map(); for (const t of list) { const k = descKey(t.description); if (k) m.set(k, (m.get(k) || 0) + 1); } return m; };
            let counts = countBy(allTransactions.filter(t => t.transaction_date >= since));
            if (counts.size < 6) counts = countBy(allTransactions);
            frequentItems = [...counts.entries()]
                .sort((a, b) => b[1] - a[1] || (lastByDescription.get(b[0]).transaction_date > lastByDescription.get(a[0]).transaction_date ? 1 : -1))
                .slice(0, 6)
                .map(([k]) => lastByDescription.get(k));
        };
        let frequentItems = [];

        // ---- [NEW] ปุ่มประเภทแตะเดียว ----
        const setTypeValue = (inputId, value) => {
            document.getElementById(inputId).value = value;
            document.querySelectorAll(`.type-seg[data-for="${inputId}"] button`).forEach(b => b.classList.toggle('active', b.dataset.type === value));
        };
        document.querySelectorAll('.type-seg').forEach(seg => {
            seg.addEventListener('click', (e) => { const b = e.target.closest('button[data-type]'); if (b) setTypeValue(seg.dataset.for, b.dataset.type); });
        });

        // ---- [NEW] ชิปรายการบ่อย ----
        const renderQuickChips = (show) => {
            const box = document.getElementById('quick-chips');
            box.innerHTML = '';
            if (!show) return;
            frequentItems.forEach(t => {
                const b = document.createElement('button');
                b.type = 'button';
                b.innerHTML = `${esc(t.description)}<small>฿${formatMoney(t.amount).replace(/\.00$/, '')}</small>`;
                b.addEventListener('click', () => {
                    document.getElementById('description').value = t.description;
                    document.getElementById('amount').value = t.amount;
                    amountAutoFilled = true;
                    setTypeValue('type', t.type);
                });
                box.appendChild(b);
            });
        };

        let amountAutoFilled = false;
        const applySuggestion = () => {
            const match = lastByDescription.get(descKey(document.getElementById('description').value));
            if (!match) return;
            const amountEl = document.getElementById('amount');
            if (amountEl.value === '' || amountAutoFilled) {
                amountEl.value = match.amount;
                amountAutoFilled = true;
            }
            setTypeValue('type', match.type);
        };

        // ---- [NEW] Modal เพิ่มรายการ ----
        const addModalContainer = document.getElementById('add-modal-container');
        let addIsDuplicate = false;
        const daysAgoLocal = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

        // prefill = รายการต้นแบบ (ใช้ตอนกด "ซ้ำ")
        window.openAddModal = (prefill = null) => {
            const form = document.getElementById('transaction-form');
            form.reset();
            amountAutoFilled = false;
            addIsDuplicate = !!prefill;
            transactionDateEl.value = todayLocal();
            resetRecur();
            renderQuickChips(!prefill);
            if (prefill) {
                document.getElementById('description').value = prefill.description;
                document.getElementById('amount').value = prefill.amount;
                setTypeValue('type', prefill.type);
                document.getElementById('add-modal-title').textContent = 'ทำซ้ำรายการ';
                document.getElementById('add-submit-btn').textContent = 'บันทึก';
            } else {
                setTypeValue('type', store.get('lastType', 'รายจ่าย'));
                document.getElementById('add-modal-title').textContent = 'เพิ่มรายการ';
                document.getElementById('add-submit-btn').textContent = 'เพิ่มรายการ';
            }
            addModalContainer.classList.remove('hidden');
            // ทำซ้ำ: ไม่เด้งคีย์บอร์ด ให้เลือกวันที่ได้เลย / เพิ่มใหม่: โฟกัสช่องรายละเอียด
            if (!prefill) setTimeout(() => document.getElementById('description').focus(), 50);
        };
        window.closeAddModal = () => { addModalContainer.classList.add('hidden'); };

        // ---- [NEW] ซ้ำทุกเดือน ----
        const recurEnabledEl = document.getElementById('recur-enabled');
        const recurFieldsEl = document.getElementById('recur-fields');
        const recurMonthsEl = document.getElementById('recur-months');
        const recurDayEl = document.getElementById('recur-day');
        const recurPreviewEl = document.getElementById('recur-preview');
        const addSubmitBtn = document.getElementById('add-submit-btn');
        let recurDayTouched = false;
        const pad2 = (n) => String(n).padStart(2, '0');
        const daysInMonth = (y, m) => new Date(y, m, 0).getDate(); // m = 1..12
        const thaiShortMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        const shortThaiDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${thaiShortMonths[m - 1]} ${String(y + 543).slice(-2)}`; };
        const sameDayIn = (y, m, day) => `${y}-${pad2(m)}-${pad2(Math.min(day, daysInMonth(y, m)))}`;
        const computeRecurDates = (startIso, months, day) => {
            const [y0, m0] = startIso.split('-').map(Number);
            const out = [];
            for (let i = 0; i < months; i++) {
                const idx = (m0 - 1) + i;
                out.push(sameDayIn(y0 + Math.floor(idx / 12), (idx % 12) + 1, day));
            }
            return out;
        };
        const readRecur = () => {
            const months = parseInt(recurMonthsEl.value, 10);
            const day = parseInt(recurDayEl.value, 10);
            if (!transactionDateEl.value || !(months >= 2 && months <= 60) || !(day >= 1 && day <= 31)) return null;
            return computeRecurDates(transactionDateEl.value, months, day);
        };
        const updateRecurPreview = () => {
            if (!recurEnabledEl.checked) { recurPreviewEl.textContent = ''; addSubmitBtn.textContent = addIsDuplicate ? 'บันทึก' : 'เพิ่มรายการ'; return; }
            if (!recurDayTouched && transactionDateEl.value) recurDayEl.value = Number(transactionDateEl.value.slice(8, 10));
            const dates = readRecur();
            if (!dates) { recurPreviewEl.textContent = 'ใส่จำนวนเดือน 2–60 และวันที่ 1–31'; addSubmitBtn.textContent = 'บันทึก'; return; }
            const list = dates.length <= 4 ? dates.map(shortThaiDate).join(', ') : `${dates.slice(0, 3).map(shortThaiDate).join(', ')} … ${shortThaiDate(dates[dates.length - 1])}`;
            recurPreviewEl.textContent = `สร้าง ${dates.length} รายการ: ${list}`;
            addSubmitBtn.textContent = `บันทึก ${dates.length} รายการ`;
        };
        const resetRecur = () => {
            recurEnabledEl.checked = false;
            recurFieldsEl.classList.add('hidden');
            recurMonthsEl.value = 3;
            recurDayTouched = false;
            recurPreviewEl.textContent = '';
        };
        recurEnabledEl.addEventListener('change', () => { recurFieldsEl.classList.toggle('hidden', !recurEnabledEl.checked); updateRecurPreview(); });
        recurMonthsEl.addEventListener('input', updateRecurPreview);
        recurDayEl.addEventListener('input', () => { recurDayTouched = true; updateRecurPreview(); });
        transactionDateEl.addEventListener('change', updateRecurPreview);

        // ---- [NEW] ลบหลายรายการ (ใช้กับ "เลิกทำ") ----
        const undoInsert = async (ids, label) => {
            const { error } = await db.from('transactions').delete().in('id', ids);
            if (error) { toast('เลิกทำไม่สำเร็จ: ' + error.message, 'error'); return; }
            toast(label || 'เลิกทำแล้ว', 'info');
            await fetchAllTransactions();
        };

        const addTransaction = async (e) => {
            e.preventDefault();
            const form = e.currentTarget;
            await withBusyForm(form, async () => {
                const amountValue = parseFloat(document.getElementById('amount').value);
                if (isNaN(amountValue) || amountValue <= 0) {
                    toast('กรุณาป้อนจำนวนเงินที่ถูกต้อง', 'error');
                    return;
                }
                const { data: { user } } = await db.auth.getUser();
                if (!user) { toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'error'); return; }
                const type = document.getElementById('type').value;
                const description = document.getElementById('description').value.trim();
                if (!description) { toast('กรุณาใส่รายละเอียด', 'error'); return; }
                let dates = [transactionDateEl.value];
                if (recurEnabledEl.checked) {
                    dates = readRecur();
                    if (!dates) { toast('ใส่จำนวนเดือน 2–60 และวันที่ 1–31', 'error'); return; }
                }
                const rows = dates.map(d => ({ user_id: user.id, type, description, amount: amountValue, transaction_date: d }));
                const { data, error } = await db.from('transactions').insert(rows).select('id');
                if (error) { console.error('Error adding transaction:', error); toast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
                if (!addIsDuplicate) store.set('lastType', type);
                closeAddModal();
                form.reset();
                const ids = (data || []).map(r => r.id);
                const msg = rows.length > 1 ? `บันทึก "${description}" ${rows.length} เดือนแล้ว ✓` : `บันทึก "${description}" แล้ว ✓`;
                toast(msg, 'success', ids.length ? { duration: 5000, actionLabel: 'เลิกทำ', onAction: () => undoInsert(ids) } : {});
                await fetchAllTransactions();
            });
        };

        // ---- [NEW] ลบทันที แล้วกด "เลิกทำ" ได้ ----
        const restorableFields = ({ user_id, type, description, amount, transaction_date }) => ({ user_id, type, description, amount, transaction_date });

        const removeTransaction = async (id) => {
            const target = allTransactions.find(t => String(t.id) === String(id));
            if (!target) return;
            const { error } = await db.from('transactions').delete().eq('id', id);
            if (error) { console.error('Error deleting transaction:', error); toast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
            toast(`ลบ "${target.description}" แล้ว`, 'info', {
                duration: 6000,
                actionLabel: 'เลิกทำ',
                onAction: async () => {
                    const { error: undoError } = await db.from('transactions').insert(restorableFields(target));
                    if (undoError) { toast('กู้คืนไม่สำเร็จ: ' + undoError.message, 'error'); return; }
                    toast('กู้คืนแล้ว ✓', 'success');
                    await fetchAllTransactions();
                },
            });
            await fetchAllTransactions();
        };

        // ---- [NEW] ทำซ้ำ: เปิดฟอร์มที่กรอกไว้ให้แล้ว เลือกวันที่ได้ ----
        const duplicateTransaction = (id) => {
            const source = allTransactions.find(t => String(t.id) === String(id));
            if (!source) return;
            closeSwipe();
            openAddModal(source);
        };
        
        // ---- EDIT MODAL LOGIC ----
        window.openEditModal = (id) => {
            const transaction = allTransactions.find(t => String(t.id) === String(id));
            if (!transaction) return;
            document.getElementById('edit-transaction-id').value = transaction.id;
            setTypeValue('edit-type', transaction.type);
            document.getElementById('edit-description').value = transaction.description;
            document.getElementById('edit-amount').value = transaction.amount;
            document.getElementById('edit-transaction_date').value = transaction.transaction_date;
            editModalContainer.classList.remove('hidden');
        };

        window.closeEditModal = () => { editModalContainer.classList.add('hidden'); };

        const handleUpdateTransaction = async (e) => {
            e.preventDefault();
            await withBusyForm(e.currentTarget, async () => {
                const amountValue = parseFloat(document.getElementById('edit-amount').value);
                if (isNaN(amountValue) || amountValue <= 0) {
                    toast('กรุณาป้อนจำนวนเงินที่ถูกต้อง', 'error');
                    return;
                }
                const id = document.getElementById('edit-transaction-id').value;
                const editDescription = document.getElementById('edit-description').value.trim();
                if (!editDescription) { toast('กรุณาใส่รายละเอียด', 'error'); return; }
                const updatedTransaction = { type: document.getElementById('edit-type').value, description: editDescription, amount: amountValue, transaction_date: document.getElementById('edit-transaction_date').value };
                const { error } = await db.from('transactions').update(updatedTransaction).eq('id', id);
                if (error) { console.error('Error updating transaction:', error); toast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
                closeEditModal();
                toast('บันทึกการแก้ไขแล้ว ✓', 'success');
                await fetchAllTransactions();
            });
        };

        // ---- UI & FILTERING & VIEW ----
        window.setView = (view) => {
            currentView = view;
            document.querySelectorAll('.view-toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.view-toggle-btn[onclick="setView('${view}')"]`).classList.add('active');
            transactionView.classList.toggle('hidden', view !== 'transactions');
            summaryView.classList.toggle('hidden', view !== 'summary');
            renderUI();
        };

        const renderUI = () => {
            if (!yearFilterEl.value || !monthFilterEl.value) return; 
            const selectedYear = parseInt(yearFilterEl.value);
            const selectedMonth = parseInt(monthFilterEl.value);
            const monthlyTransactions = allTransactions.filter(t => { const date = new Date(t.transaction_date); date.setMinutes(date.getMinutes() + date.getTimezoneOffset()); return date.getFullYear() === selectedYear && (date.getMonth() + 1) === selectedMonth; });
            const upToCurrentMonthTransactions = allTransactions.filter(t => { const transDate = new Date(t.transaction_date); transDate.setMinutes(transDate.getMinutes() + transDate.getTimezoneOffset()); const lastDayOfMonth = new Date(selectedYear, selectedMonth, 0); return transDate <= lastDayOfMonth; });
            updateDashboard(monthlyTransactions, upToCurrentMonthTransactions);
            document.querySelectorAll('.month-label').forEach(el => { el.textContent = `${thaiShortMonths[selectedMonth - 1]} ${String(selectedYear + 543).slice(-2)}`; });
            updateMonthNavButtons();
            if (currentView === 'transactions') {
                const query = searchInputEl.value.trim();
                if (query) renderSearchResults(query);
                else renderTransactionList(monthlyTransactions.slice().sort(byDateDesc));
            } else {
                const yearlyTransactions = allTransactions.filter(t => { const date = new Date(t.transaction_date); date.setMinutes(date.getMinutes() + date.getTimezoneOffset()); return date.getFullYear() === selectedYear; });
                renderSummary(yearlyTransactions, selectedYear);
            }
        };
        
        // === JAVASCRIPT LOGIC UPDATED HERE ===
        const updateDashboard = (monthlyTransactions, upToCurrentMonthTransactions) => {
            const { income, totalExpense } = monthlyTransactions.reduce((acc, t) => {
                if (t.type === 'รายรับ') {
                    acc.income += t.amount;
                } else { // Handles both 'รายจ่าย' and 'รายจ่าย (บัตรเครดิต)'
                    acc.totalExpense += t.amount;
                }
                return acc;
            }, { income: 0, totalExpense: 0 });

            const difference = income - totalExpense;
            const cumulativeBalance = upToCurrentMonthTransactions.reduce((acc, t) => (t.type === 'รายรับ' ? acc + t.amount : acc - t.amount), 0);

            document.getElementById('balance').innerHTML = `฿${formatMoney(cumulativeBalance)}`;
            document.getElementById('total-income').innerHTML = `฿${formatMoney(income)}`;
            document.getElementById('total-expense').innerHTML = `฿${formatMoney(totalExpense)}`;

            const differenceEl = document.getElementById('monthly-difference');
            differenceEl.innerHTML = `฿${formatMoney(difference)}`;
            differenceEl.classList.toggle('positive', difference >= 0);
            differenceEl.classList.toggle('negative', difference < 0);
        };
        
        const byDateDesc = (a, b) =>
            a.transaction_date < b.transaction_date ? 1 : a.transaction_date > b.transaction_date ? -1 : (Number(b.id) || 0) - (Number(a.id) || 0);

        const typeTag = (type) => type === 'รายรับ' ? '<span class="item-tag income">รับ</span>' : type === 'รายจ่าย (บัตรเครดิต)' ? '<span class="item-tag credit">บัตร</span>' : '';
        const transactionItemHTML = (t, opts = {}) => {
            const showDate = opts.showDate !== false;
            const sign = t.type === 'รายรับ' ? '+' : '-';
            const itemClass = t.type === 'รายรับ' ? 'positive' : 'negative';
            const formattedDate = new Date(t.transaction_date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', calendar: 'buddhist', timeZone: 'UTC' });
            const id = esc(t.id);
            return `<div class="item-actions-behind">`
                + `<button type="button" class="dup-btn" tabindex="-1" onclick="duplicateTransaction('${id}')">ซ้ำ</button>`
                + `<button type="button" class="edit-btn" tabindex="-1" onclick="openEditModal('${id}')">แก้ไข</button>`
                + `<button type="button" class="delete-btn" tabindex="-1" onclick="removeTransaction('${id}')">ลบ</button>`
                + `</div>`
                + `<div class="item-front"><div class="item-details"><span class="item-name">${typeTag(t.type)}${esc(t.description)}</span>${showDate ? `<span class="item-date">${formattedDate}</span>` : ''}</div>`
                + `<span class="item-amount ${itemClass}">${sign}฿${formatMoney(t.amount)}</span></div>`;
        };

        // ---- [NEW] ปัดซ้ายเพื่อโชว์เครื่องมือ (แตะเพื่อเปิด/ปิดก็ได้) ----
        const SWIPE_WIDTH = 216;
        let openFront = null;
        let swipe = null;
        const setActionsFocusable = (front, on) => {
            const behind = front.previousElementSibling;
            if (behind) behind.querySelectorAll('button').forEach(b => { b.tabIndex = on ? 0 : -1; });
        };
        const openSwipe = (front) => {
            if (openFront && openFront !== front) closeSwipe();
            front.style.transform = `translateX(-${SWIPE_WIDTH}px)`;
            front.classList.add('open');
            setActionsFocusable(front, true);
            openFront = front;
        };
        const closeSwipe = () => {
            if (!openFront) return;
            openFront.style.transform = '';
            openFront.classList.remove('open');
            setActionsFocusable(openFront, false);
            openFront = null;
        };
        const listRoot = document.getElementById('list');
        listRoot.addEventListener('pointerdown', (e) => {
            const front = e.target.closest('.item-front');
            if (!front || (e.pointerType === 'mouse' && e.button !== 0)) return;
            swipe = { front, id: e.pointerId, x0: e.clientX, y0: e.clientY, base: front === openFront ? -SWIPE_WIDTH : 0, dir: null, x: null };
        });
        listRoot.addEventListener('pointermove', (e) => {
            if (!swipe || e.pointerId !== swipe.id) return;
            const dx = e.clientX - swipe.x0;
            const dy = e.clientY - swipe.y0;
            if (swipe.dir === null) {
                if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                swipe.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
                if (swipe.dir === 'v') return;
                if (openFront && openFront !== swipe.front) closeSwipe();
                swipe.front.classList.add('dragging');
                try { swipe.front.setPointerCapture(e.pointerId); } catch {}
            }
            if (swipe.dir !== 'h') return;
            swipe.x = Math.min(0, Math.max(-SWIPE_WIDTH - 40, swipe.base + dx));
            swipe.front.style.transform = `translateX(${swipe.x}px)`;
        });
        const endSwipe = (e) => {
            if (!swipe || e.pointerId !== swipe.id) return;
            const s = swipe;
            swipe = null;
            s.front.classList.remove('dragging');
            if (s.dir === 'h') {
                if (s.x !== null && s.x < -SWIPE_WIDTH / 3) openSwipe(s.front);
                else { if (openFront === s.front) openFront = null; s.front.style.transform = ''; s.front.classList.remove('open'); setActionsFocusable(s.front, false); }
            } else if (s.dir === null && e.type === 'pointerup') {
                // แตะเฉย ๆ = เปิด/ปิด
                if (openFront === s.front) closeSwipe(); else openSwipe(s.front);
            }
        };
        listRoot.addEventListener('pointerup', endSwipe);
        listRoot.addEventListener('pointercancel', endSwipe);
        // แตะที่อื่น หรือกดปุ่มเครื่องมือแล้ว ให้ปิด
        document.addEventListener('click', (e) => {
            if (!openFront) return;
            if (e.target.closest('.item-front')) return;
            if (e.target.closest('.item-actions-behind')) { setTimeout(closeSwipe, 0); return; }
            closeSwipe();
        });

        // ---- [NEW] ค้นหาทุกเดือน ----
        const searchInputEl = document.getElementById('search-input');
        const renderSearchResults = (query) => {
            openFront = null;
            const listEl = document.getElementById('list');
            const q = query.toLowerCase();
            const matches = allTransactions.filter(t =>
                String(t.description ?? '').toLowerCase().includes(q) || formatMoney(t.amount).replace(/,/g, '').includes(q.replace(/,/g, ''))
            ).sort(byDateDesc);
            const income = matches.filter(t => t.type === 'รายรับ').reduce((s, t) => s + t.amount, 0);
            const expense = matches.filter(t => t.type !== 'รายรับ').reduce((s, t) => s + t.amount, 0);
            const LIMIT = 200;
            let html = `<div class="search-summary"><span>พบ ${matches.length} รายการ</span><span>${income ? `<span style="color:#80FFAF">+${formatMoney(income)}</span> ` : ''}${expense ? `<span style="color:#FF8A8A">-${formatMoney(expense)}</span>` : ''}</span></div>`;
            if (matches.length === 0) {
                html += '<p style="text-align: center; padding: 20px 0; background:#fff; color:#000; border: 2px solid #000; border-top: none;">ไม่พบรายการที่ตรงกับคำค้น</p>';
            } else {
                html += '<ul class="sub-list">' + matches.slice(0, LIMIT).map(t => `<li class="transaction-item">${transactionItemHTML(t)}</li>`).join('') + '</ul>';
                if (matches.length > LIMIT) html += `<p style="text-align:center; padding: 10px; background:#fff; color:#555; border: 2px solid #000; border-top: none;">แสดง ${LIMIT} รายการล่าสุด พิมพ์คำค้นให้ละเอียดขึ้นเพื่อดูที่เหลือ</p>`;
            }
            listEl.innerHTML = html;
        };

        // ---- [NEW] รายการแบบรายวัน ----
        const dayLabel = (iso) => {
            if (iso === todayLocal()) return 'วันนี้';
            if (iso === daysAgoLocal(1)) return 'เมื่อวาน';
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });
        };
        const signedNet = (list) => list.reduce((sum, t) => sum + (t.type === 'รายรับ' ? t.amount : -t.amount), 0);

        const renderTransactionList = (transactions) => {
            openFront = null;
            const listEl = document.getElementById('list');
            listEl.innerHTML = '';
            if (transactions.length === 0) { listEl.innerHTML = '<p style="text-align: center; padding: 20px 0; background:#fff; color:#000; border: 2px solid #000;">ยังไม่มีรายการในเดือนนี้ · กด + เพื่อเพิ่ม</p>'; return; }
            const byDay = new Map();
            for (const t of transactions) { if (!byDay.has(t.transaction_date)) byDay.set(t.transaction_date, []); byDay.get(t.transaction_date).push(t); }
            let html = '';
            for (const [day, items] of byDay) {
                const net = signedNet(items);
                html += `<div class="day-header"><span>${esc(dayLabel(day))}</span><span class="${net >= 0 ? 'positive' : 'negative'}">${net >= 0 ? '+' : '-'}${formatMoney(Math.abs(net))}</span></div>`;
                html += '<ul class="sub-list">' + items.map(t => `<li class="transaction-item">${transactionItemHTML(t, { showDate: false })}</li>`).join('') + '</ul>';
            }
            listEl.innerHTML = html;
        };

        const renderSummary = (yearlyTransactions, year) => {
            document.getElementById('summary-year-title').innerText = `พ.ศ. ${year + 543}`;
            const startDateOfYear = new Date(year, 0, 1);
            let runningBalance = allTransactions.filter(t => { const transDate = new Date(t.transaction_date); transDate.setMinutes(transDate.getMinutes() + transDate.getTimezoneOffset()); return transDate < startDateOfYear; }).reduce((acc, t) => (t.type === 'รายรับ' ? acc + t.amount : acc - t.amount), 0);
            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            let summaryData = Array(12).fill(0).map((_, i) => ({ month: thaiMonths[i], income: 0, expense: 0, credit: 0 }));
            yearlyTransactions.forEach(t => { const date = new Date(t.transaction_date); date.setMinutes(date.getMinutes() + date.getTimezoneOffset()); const monthIndex = date.getMonth(); if (t.type === 'รายรับ') summaryData[monthIndex].income += t.amount; else if (t.type === 'รายจ่าย') summaryData[monthIndex].expense += t.amount; else if (t.type === 'รายจ่าย (บัตรเครดิต)') summaryData[monthIndex].credit += t.amount; });
            const tableEl = document.getElementById('summary-table');
            let tableHTML = `<thead><tr style="background-color: #f0f0f0;"><th style="padding: 12px 8px; text-align: center;">เดือน</th><th style="padding: 12px 8px; text-align: center;">รายรับ</th><th style="padding: 12px 8px; text-align: center;">รายจ่าย</th><th style="padding: 12px 8px; text-align: center;">บัตรเครดิต</th><th style="padding: 12px 8px; text-align: center;">คงเหลือสะสม</th></tr></thead><tbody>`;
            let total = { income: 0, expense: 0, credit: 0 };
            summaryData.forEach(data => { 
                runningBalance += data.income - (data.expense + data.credit); 
                total.income += data.income; 
                total.expense += data.expense; 
                total.credit += data.credit; 
                tableHTML += `<tr style="border-bottom: 1px solid #ddd;">
                                <td style="text-align: left; padding: 12px 8px; font-weight: 500;">${data.month}</td>
                                <td class="positive" style="text-align: right; padding: 12px 8px;">${formatMoney(data.income)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(data.expense)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(data.credit)}</td>
                                <td class="${runningBalance >= 0 ? 'positive' : 'negative'}" style="text-align: right; padding: 12px 8px;">${formatMoney(runningBalance)}</td>
                              </tr>`; 
            });
            tableHTML += `</tbody><tfoot style="font-weight: bold; background-color: #f0f0f0;">
                            <tr>
                                <td style="text-align: left; padding: 12px 8px;">รวม</td>
                                <td class="positive" style="text-align: right; padding: 12px 8px;">${formatMoney(total.income)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(total.expense)}</td>
                                <td class="negative" style="text-align: right; padding: 12px 8px;">${formatMoney(total.credit)}</td>
                                <td class="${runningBalance >= 0 ? 'positive' : 'negative'}" style="text-align: right; padding: 12px 8px;">${formatMoney(runningBalance)}</td>
                            </tr>
                          </tfoot>`;
            tableEl.innerHTML = tableHTML;
        };

        const START_YEAR = 2024;

        // [FIX] ช่วงปีคำนวณจากข้อมูลจริง (ไม่ล็อก 2024)
        const yearRange = () => {
            const currentYear = new Date().getFullYear();
            let min = Math.min(START_YEAR, currentYear), max = currentYear + 1;
            for (const t of allTransactions) { const y = getTransactionYear(t.transaction_date); if (y) { if (y < min) min = y; if (y > max) max = y; } }
            return { min, max };
        };
        const refreshYearOptions = () => {
            [yearFilterEl, exportYearFilterEl].forEach(el => { const keep = parseInt(el.value, 10); populateYearSelect(el, keep); });
        };
        const populateYearSelect = (selectEl, selectedYear) => {
            const now = new Date();
            const currentYear = now.getFullYear();
            const { min, max } = yearRange();
            selectEl.innerHTML = '';
            for (let i = max; i >= min; i--) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i + 543;
                selectEl.appendChild(option);
            }
            selectEl.value = Number.isFinite(selectedYear) ? selectedYear : currentYear;
        };

        const populateDateFilters = () => {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            populateYearSelect(yearFilterEl, Math.max(currentYear, START_YEAR));
            populateYearSelect(exportYearFilterEl, Math.max(currentYear, START_YEAR));

            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            monthFilterEl.innerHTML = '';
            thaiMonths.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index + 1;
                option.textContent = window.innerWidth < 420 ? thaiShortMonths[index] : month; // จอแคบใช้ชื่อย่อ กันตัดคำ
                monthFilterEl.appendChild(option);
            });
            
            monthFilterEl.value = currentMonth;
        };
        
        const formatMoney = (number) => Number(number).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');

        const XLSX_HEADERS = ['transaction_date', 'type', 'description', 'amount'];

        const excelSerialToDateString = (serial) => {
            const utcDays = Math.floor(serial) - 25569;
            const jsDate = new Date(utcDays * 86400000);
            const y = jsDate.getUTCFullYear();
            const m = String(jsDate.getUTCMonth() + 1).padStart(2, '0');
            const d = String(jsDate.getUTCDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        // [FIX] ตรวจว่าเป็นวันที่มีจริง (กัน 31/02)
        const isRealDate = (y, m, d) => { if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1)) return false; return d <= new Date(y, m, 0).getDate(); };
        const parseThaiSlashDate = (value) => {
            const match = String(value).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
            if (!match) return null;
            const day = parseInt(match[1], 10);
            const month = parseInt(match[2], 10);
            let year = parseInt(match[3], 10);
            if (year < 100) {
                year = year >= 40 ? year + 2500 - 543 : 2000 + year;
            } else if (year > 2400) {
                year = year - 543;
            }
            if (!isRealDate(year, month, day)) return null;
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        };

        const formatDateForSupabase = (excelDate) => {
            try {
                if (typeof excelDate === 'number') {
                    return excelSerialToDateString(excelDate);
                }
                if (excelDate instanceof Date && !isNaN(excelDate)) {
                    return excelSerialToDateString(25569 + excelDate.getTime() / 86400000);
                }
                if (typeof excelDate === 'string') {
                    const iso = excelDate.trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
                    if (iso) {
                        let [y, m, d] = [Number(iso[1]), Number(iso[2]), Number(iso[3])];
                        if (y > 2400) y -= 543;
                        if (isRealDate(y, m, d)) return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        throw new Error('Invalid date');
                    }
                    const thaiDate = parseThaiSlashDate(excelDate);
                    if (thaiDate) return thaiDate;
                }
                throw new Error('Invalid date format');
            } catch (e) {
                console.error('Could not parse date:', excelDate);
                return null;
            }
        };

        const getTransactionYear = (transactionDate) => parseInt(String(transactionDate).slice(0, 4), 10);

        // [FIX] SheetJS รุ่นฟรีทำ dropdown ไม่ได้ → แนบชีต "วิธีกรอก" แทน
        const exportTemplate = () => {
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet([XLSX_HEADERS]);
            ws['!cols'] = [{ wch: 16 }, { wch: 22 }, { wch: 30 }, { wch: 12 }];
            XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
            const help = XLSX.utils.aoa_to_sheet([
                ['คอลัมน์', 'วิธีกรอก', 'ตัวอย่าง'],
                ['transaction_date', 'วันที่ แบบ 2026-11-25 หรือ 25/11/2569 หรือ 25/11/69', '25/11/2569'],
                ['type', 'พิมพ์อย่างใดอย่างหนึ่ง: รายรับ / รายจ่าย / รายจ่าย (บัตรเครดิต)  (พิมพ์ "บัตรเครดิต" ก็ได้)', 'รายจ่าย'],
                ['description', 'รายละเอียด ห้ามว่าง', 'ค่าเน็ต'],
                ['amount', 'จำนวนเงิน มากกว่า 0 (ใส่ลูกน้ำได้)', '599'],
                [],
                ['หมายเหตุ', 'กรอกข้อมูลในชีต Transactions เท่านั้น · แถวที่ซ้ำกับข้อมูลเดิมในแอปจะถูกข้ามให้อัตโนมัติ', ''],
            ]);
            help['!cols'] = [{ wch: 16 }, { wch: 70 }, { wch: 14 }];
            XLSX.utils.book_append_sheet(wb, help, 'วิธีกรอก');
            XLSX.writeFile(wb, 'template.xlsx');
        };
        const exportData = () => {
            const exportYear = parseInt(exportYearFilterEl.value, 10);
            const filtered = allTransactions.filter(t => getTransactionYear(t.transaction_date) === exportYear);
            if (filtered.length === 0) {
                toast(`ไม่มีข้อมูลสำหรับ Export ในปี ${exportYear + 543}`, 'error');
                return;
            }
            const dataToExport = filtered.map(({ id, user_id, created_at, ...rest }) => ({ ...rest, transaction_date: rest.transaction_date }));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(dataToExport, { header: XLSX_HEADERS });
            XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
            XLSX.writeFile(wb, `transactions_${exportYear + 543}.xlsx`);
        };
        // [FIX] Import: ตรวจข้อมูลครบ, กันซ้ำ, แจ้งแถวที่ข้าม
        const VALID_TYPES = ['รายรับ', 'รายจ่าย', 'รายจ่าย (บัตรเครดิต)'];
        const normalizeType = (v) => {
            const t = String(v ?? '').trim();
            if (VALID_TYPES.includes(t)) return t;
            if (t === 'บัตรเครดิต' || t === 'บัตร' || t === 'รายจ่าย(บัตรเครดิต)') return 'รายจ่าย (บัตรเครดิต)';
            return null;
        };
        const txKey = (t) => `${t.transaction_date}|${t.type}|${descKey(t.description)}|${Number(t.amount).toFixed(2)}`;
        const importFromXLSX = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: false });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet, { raw: true, blankrows: false });
                    const { data: { user } } = await db.auth.getUser();
                    if (!user) throw new Error('ไม่พบข้อมูลผู้ใช้ กรุณาเข้าสู่ระบบใหม่');
                    const existing = new Map();
                    for (const t of allTransactions) { const k = txKey(t); existing.set(k, (existing.get(k) || 0) + 1); }
                    const toInsert = [];
                    const badRows = [];
                    let dupCount = 0;
                    json.forEach((row, i) => {
                        const rowNo = (row.__rowNum__ ?? i + 1) + 1;
                        const transaction_date = formatDateForSupabase(row.transaction_date);
                        const type = normalizeType(row.type);
                        const description = String(row.description ?? '').trim();
                        const amount = typeof row.amount === 'number' ? row.amount : parseFloat(String(row.amount ?? '').replace(/[,\s฿]/g, ''));
                        if (!transaction_date || !type || !description || !(amount > 0)) { badRows.push(rowNo); return; }
                        const t = { user_id: user.id, transaction_date, type, description, amount: Math.round(amount * 100) / 100 };
                        const k = txKey(t);
                        if ((existing.get(k) || 0) > 0) { existing.set(k, existing.get(k) - 1); dupCount++; return; }
                        toInsert.push(t);
                    });
                    for (let i = 0; i < toInsert.length; i += 500) {
                        const { error } = await db.from('transactions').insert(toInsert.slice(i, i + 500));
                        if (error) throw new Error(`${error.message} (นำเข้าได้ ${i} รายการก่อนเกิดข้อผิดพลาด)`);
                    }
                    const parts = [`นำเข้า ${toInsert.length} รายการ`];
                    if (dupCount) parts.push(`ข้ามที่ซ้ำ ${dupCount}`);
                    if (badRows.length) parts.push(`ข้อมูลผิด ${badRows.length} แถว (แถว ${badRows.slice(0, 8).join(', ')}${badRows.length > 8 ? ', …' : ''})`);
                    toast(parts.join(' · '), toInsert.length ? 'success' : 'error', { duration: badRows.length ? 9000 : 5000 });
                    if (toInsert.length) await fetchAllTransactions();
                } catch (error) {
                    console.error('เกิดข้อผิดพลาดในการนำเข้า:', error);
                    toast('เกิดข้อผิดพลาดในการนำเข้า: ' + error.message, 'error', { duration: 8000 });
                } finally {
                    event.target.value = null;
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // ---- APP INITIALIZATION ----
        // [FIX] กันไม่ให้ initializeApp ทำงานซ้ำ (Supabase อาจส่ง SIGNED_IN ซ้ำตอนสลับแท็บ ทำให้ตัวกรองเด้งกลับเดือนปัจจุบัน)
        let appReady = false;
        const initializeApp = async () => {
            if (appReady) return;
            const { data: { session } } = await db.auth.getSession();
            if (appReady) return;
            if (session) {
                appReady = true;
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userEmailDisplay.textContent = session.user.email;
                transactionDateEl.value = todayLocal();
                populateDateFilters();
                await fetchAllTransactions();
            } else {
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        };
        db.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN') {
                // เรียกผ่าน setTimeout ตามคำแนะนำของ Supabase เพื่อไม่ให้ await ภายใน callback ค้าง
                setTimeout(initializeApp, 0);
            } else if (event === 'SIGNED_OUT') {
                appReady = false;
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
                allTransactions = [];
                userEmailDisplay.textContent = '';
                document.getElementById('list').innerHTML = '';
                document.getElementById('login-form').reset();
            }
        });

        // Event Listeners
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('logout-btn').addEventListener('click', handleLogout);
        document.getElementById('transaction-form').addEventListener('submit', addTransaction);
        document.getElementById('edit-transaction-form').addEventListener('submit', handleUpdateTransaction);
        yearFilterEl.addEventListener('change', () => {
            exportYearFilterEl.value = yearFilterEl.value;
            renderUI();
        });
        monthFilterEl.addEventListener('change', renderUI);
        document.getElementById('export-template-btn').addEventListener('click', exportTemplate);
        document.getElementById('export-data-btn').addEventListener('click', exportData);
        document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
        document.getElementById('import-file').addEventListener('change', importFromXLSX);

        // ---- [NEW] ปุ่ม ◀ ▶ เปลี่ยนเดือน ----
        const prevMonthBtn = document.getElementById('prev-month-btn');
        const nextMonthBtn = document.getElementById('next-month-btn');
        const hasYearOption = (y) => [...yearFilterEl.options].some(o => Number(o.value) === y);
        const shiftedMonth = (delta) => {
            let y = parseInt(yearFilterEl.value, 10);
            let m = parseInt(monthFilterEl.value, 10) + delta;
            if (m < 1) { m = 12; y -= 1; }
            if (m > 12) { m = 1; y += 1; }
            return { y, m };
        };
        const shiftMonth = (delta) => {
            const { y, m } = shiftedMonth(delta);
            if (!hasYearOption(y)) return;
            yearFilterEl.value = y;
            exportYearFilterEl.value = y;
            monthFilterEl.value = m;
            renderUI();
        };
        const updateMonthNavButtons = () => {
            prevMonthBtn.disabled = !hasYearOption(shiftedMonth(-1).y);
            nextMonthBtn.disabled = !hasYearOption(shiftedMonth(1).y);
        };
        prevMonthBtn.addEventListener('click', () => shiftMonth(-1));
        nextMonthBtn.addEventListener('click', () => shiftMonth(1));

        // ---- [NEW] ค้นหา ----
        const searchClearBtn = document.getElementById('search-clear');
        let searchTimer;
        searchInputEl.addEventListener('input', () => {
            searchClearBtn.classList.toggle('hidden', !searchInputEl.value);
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderUI, 150);
        });
        searchClearBtn.addEventListener('click', () => {
            searchInputEl.value = '';
            searchClearBtn.classList.add('hidden');
            renderUI();
            searchInputEl.focus();
        });

        // ---- [NEW] Modal เพิ่มรายการ + เติมให้เอง ----
        document.getElementById('add-fab').addEventListener('click', () => openAddModal());
        document.querySelectorAll('.date-chips button').forEach(btn => {
            btn.addEventListener('click', () => { transactionDateEl.value = daysAgoLocal(Number(btn.dataset.daysAgo)); });
        });
        const descriptionEl = document.getElementById('description');
        descriptionEl.addEventListener('input', applySuggestion);
        descriptionEl.addEventListener('change', applySuggestion);
        document.getElementById('amount').addEventListener('input', () => { amountAutoFilled = false; });

        // ---- [NEW] ปิด modal ด้วย Esc หรือแตะพื้นหลัง ----
        [addModalContainer, editModalContainer].forEach(container => {
            container.addEventListener('click', (ev) => { if (ev.target === container) container.classList.add('hidden'); });
        });
        document.addEventListener('keydown', (ev) => {
            if (ev.key !== 'Escape') return;
            addModalContainer.classList.add('hidden');
            editModalContainer.classList.add('hidden');
        });

        // ---- [NEW] ออกจากระบบแล้วล้างหน้าจอ ----
        db.auth.onAuthStateChange((event) => {
            if (event !== 'SIGNED_OUT') return;
            addModalContainer.classList.add('hidden');
            editModalContainer.classList.add('hidden');
            searchInputEl.value = '';
            searchClearBtn.classList.add('hidden');
            toastHost.innerHTML = '';
        });

        // ---- [NEW] คัดลอกรายการทั้งเดือนไปเดือนอื่น ----
        const copyModalContainer = document.getElementById('copy-modal-container');
        const copyYearEl = document.getElementById('copy-year');
        const copyMonthEl = document.getElementById('copy-month');
        const copyListEl = document.getElementById('copy-list');
        const copyConfirmBtn = document.getElementById('copy-confirm-btn');
        const thaiFullMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let copySource = [];
        let copySrc = { y: 0, m: 0 };
        const monthPrefix = (y, m) => `${y}-${pad2(m)}`;
        const sameItemKey = (t) => `${t.type}|${descKey(t.description)}|${Number(t.amount).toFixed(2)}`;

        const updateCopyCount = () => {
            const n = copyListEl.querySelectorAll('input:checked').length;
            copyConfirmBtn.textContent = n ? `คัดลอก ${n} รายการ` : 'คัดลอก';
            copyConfirmBtn.disabled = n === 0;
            copyConfirmBtn.style.opacity = n ? '' : '0.5';
        };
        const renderCopyList = () => {
            const ty = parseInt(copyYearEl.value, 10), tm = parseInt(copyMonthEl.value, 10);
            const targetKeys = new Map();
            allTransactions.filter(t => t.transaction_date.startsWith(monthPrefix(ty, tm)))
                .forEach(t => { const k = sameItemKey(t); targetKeys.set(k, (targetKeys.get(k) || 0) + 1); });
            const isSame = ty === copySrc.y && tm === copySrc.m;
            copyListEl.innerHTML = copySource.map((t, i) => {
                const k = sameItemKey(t);
                const exists = (targetKeys.get(k) || 0) > 0;
                if (exists) targetKeys.set(k, targetKeys.get(k) - 1);
                const day = Number(t.transaction_date.slice(8, 10));
                const sign = t.type === 'รายรับ' ? '+' : '-';
                return `<li><label><input type="checkbox" data-i="${i}" data-exists="${exists ? 1 : 0}" ${exists || isSame ? '' : 'checked'}>`
                    + `<span class="c-desc">${typeTag(t.type)}${esc(t.description)}<span class="c-day">วันที่ ${day}</span>${exists ? '<span class="c-exists">เดือนปลายทางมีรายการนี้แล้ว</span>' : ''}</span>`
                    + `<span class="c-amt ${t.type === 'รายรับ' ? 'positive' : 'negative'}">${sign}${formatMoney(t.amount)}</span></label></li>`;
            }).join('');
            updateCopyCount();
        };
        window.openCopyModal = () => {
            closeSwipe();
            copySrc = { y: parseInt(yearFilterEl.value, 10), m: parseInt(monthFilterEl.value, 10) };
            copySource = allTransactions.filter(t => t.transaction_date.startsWith(monthPrefix(copySrc.y, copySrc.m)))
                .sort((a, b) => a.transaction_date < b.transaction_date ? -1 : a.transaction_date > b.transaction_date ? 1 : (Number(a.id) || 0) - (Number(b.id) || 0));
            if (!copySource.length) { toast('เดือนนี้ยังไม่มีรายการให้คัดลอก', 'error'); return; }
            document.getElementById('copy-from-label').textContent = `จาก ${thaiFullMonths[copySrc.m - 1]} ${copySrc.y + 543} (${copySource.length} รายการ) · วันที่เดิม`;
            copyYearEl.innerHTML = yearFilterEl.innerHTML;
            copyMonthEl.innerHTML = thaiFullMonths.map((n, i) => `<option value="${i + 1}">${n}</option>`).join('');
            let ty = copySrc.y, tm = copySrc.m + 1;
            if (tm > 12) { tm = 1; ty += 1; }
            if (![...copyYearEl.options].some(o => Number(o.value) === ty)) { const o = document.createElement('option'); o.value = ty; o.textContent = ty + 543; copyYearEl.prepend(o); }
            copyYearEl.value = ty;
            copyMonthEl.value = tm;
            renderCopyList();
            copyModalContainer.classList.remove('hidden');
        };
        window.closeCopyModal = () => { copyModalContainer.classList.add('hidden'); };
        document.getElementById('copy-month-btn').addEventListener('click', openCopyModal);
        copyYearEl.addEventListener('change', renderCopyList);
        copyMonthEl.addEventListener('change', renderCopyList);
        copyListEl.addEventListener('change', updateCopyCount);
        document.querySelector('.copy-quick').addEventListener('click', (e) => {
            const b = e.target.closest('button[data-pick]');
            if (!b) return;
            copyListEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
                const t = copySource[Number(cb.dataset.i)];
                const fresh = cb.dataset.exists !== '1'; // ข้ามรายการที่เดือนปลายทางมีแล้ว (ติ๊กเองได้)
                cb.checked = b.dataset.pick === 'all' ? fresh : b.dataset.pick === 'expense' ? fresh && t.type !== 'รายรับ' : false;
            });
            updateCopyCount();
        });
        copyConfirmBtn.addEventListener('click', async () => {
            if (copyConfirmBtn.dataset.busy) return;
            const ty = parseInt(copyYearEl.value, 10), tm = parseInt(copyMonthEl.value, 10);
            if (ty === copySrc.y && tm === copySrc.m) { toast('เลือกเดือนปลายทางที่ไม่ใช่เดือนเดิม', 'error'); return; }
            const picked = [...copyListEl.querySelectorAll('input:checked')].map(cb => copySource[Number(cb.dataset.i)]);
            if (!picked.length) return;
            const { data: { user } } = await db.auth.getUser();
            if (!user) { toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'error'); return; }
            const rows = picked.map(t => ({ user_id: user.id, type: t.type, description: t.description, amount: t.amount, transaction_date: sameDayIn(ty, tm, Number(t.transaction_date.slice(8, 10))) }));
            copyConfirmBtn.dataset.busy = '1';
            copyConfirmBtn.textContent = 'กำลังคัดลอก...';
            try {
                const { data, error } = await db.from('transactions').insert(rows).select('id');
                if (error) { toast('คัดลอกไม่สำเร็จ: ' + error.message, 'error'); return; }
                closeCopyModal();
                const ids = (data || []).map(r => r.id);
                toast(`คัดลอก ${rows.length} รายการไป ${thaiShortMonths[tm - 1]} ${String(ty + 543).slice(-2)} แล้ว ✓`, 'success', ids.length ? { duration: 6000, actionLabel: 'เลิกทำ', onAction: () => undoInsert(ids) } : {});
                await fetchAllTransactions();
                if (hasYearOption(ty)) { yearFilterEl.value = ty; exportYearFilterEl.value = ty; monthFilterEl.value = tm; renderUI(); }
            } finally {
                delete copyConfirmBtn.dataset.busy;
                updateCopyCount();
            }
        });
        copyModalContainer.addEventListener('click', (ev) => { if (ev.target === copyModalContainer) closeCopyModal(); });
        document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeCopyModal(); });
        db.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') closeCopyModal(); });

        initializeApp();
    </script>
</body>
</html>
